<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>北境求生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: full-screen canvas world, HUD pinned to the four corners, modal panels in the center */
:root{
  --bg:#0e1411; --panel:#18201b; --panel2:#212b24; --line:#35433a;
  --ink:#ebe5d3; --mute:#9aa496; --accent:#e0a646; --accent2:#8fc0d8;
  --hp:#c94a3d; --st:#e2c14d; --good:#7fb069; --bad:#d06a5a;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--mute)}

.hud{position:fixed;pointer-events:none;z-index:5}
#stats{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);display:grid;gap:6px;width:min(220px,46vw)}
.bar{position:relative;height:14px;background:#000a;border:1px solid #ffffff22;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .15s}
#hpFill{background:linear-gradient(#e0624f,var(--hp))}
#stFill{background:linear-gradient(#f2d873,var(--st))}
.bar.st{height:8px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:13px;padding-left:6px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
#foods{display:flex;gap:6px;margin-top:2px}
.food{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#000a;border:1px solid #ffffff1c;position:relative}
.food.empty{opacity:.35;border-style:dashed}
.food svg{position:absolute;inset:-2px;width:38px;height:38px;transform:rotate(-90deg)}
#buffs{font-size:11px;color:var(--accent2);text-shadow:0 1px 2px #000;min-height:14px}
#petHud{font-size:11px;color:var(--good);text-shadow:0 1px 2px #000}
#petHud.down{color:var(--bad)}

#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);text-align:center;width:min(520px,92vw)}
#clock{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.08em;text-shadow:0 1px 3px #000}
#goal{margin-top:4px;font-size:12px;color:var(--ink);background:#0009;border:1px solid #ffffff14;display:inline-block;padding:4px 10px;border-radius:999px;text-wrap:balance}
#goal b{color:var(--accent);font-weight:600;margin-right:6px}

#topr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 14px);pointer-events:auto;display:flex;gap:6px}
.chip-btn{background:#0d130fcc;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip-btn:hover{border-color:var(--accent)}

#weaponTag{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px);font-size:12px;color:var(--mute);text-shadow:0 1px 2px #000}
#weaponTag b{color:var(--ink);font-weight:600}
#toast{top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);font-size:13px;background:#000b;border-radius:6px;padding:6px 12px;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
#bossBar{bottom:calc(env(safe-area-inset-bottom,0px) + 130px);left:50%;transform:translateX(-50%);width:min(420px,80vw);text-align:center}
#bossBar span{font-family:var(--display);font-weight:900;letter-spacing:.2em;font-size:14px;text-shadow:0 1px 3px #000}
#bossBar .bar{height:10px;margin-top:4px}
#bossFill{background:linear-gradient(90deg,#6d7d8c,#c7d6e2)}
#mini{display:block;width:140px;height:140px;border-radius:8px;border:1px solid #ffffff2a;box-shadow:0 2px 8px #0008;pointer-events:auto;cursor:pointer;margin-top:2px}
#bigmap .sheet{width:min(640px,100%);max-height:none;padding:0}
#bigmap header{padding:10px 10px 8px 16px}
#bigCv{display:block;width:100%;aspect-ratio:1;background:#0b1a22}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 12px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#banner{top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,46px);letter-spacing:.12em;color:var(--accent);text-shadow:0 2px 14px #000,0 0 30px #e0a64655;opacity:0;transition:opacity .6s;text-align:center;white-space:nowrap}
#banner small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;color:var(--ink);margin-top:6px}
#banner.on{opacity:1}

/* touch controls */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff30;background:#00000026;display:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#ffffff40}
#pad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:190px;height:190px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid #ffffff38;background:#0d130fb3;color:var(--ink);font-size:13px;display:grid;place-items:center;touch-action:none}
.tb:active,.tb.down{background:#e0a64655;border-color:var(--accent)}
#bAtk{right:0;bottom:0;width:84px;height:84px;font-family:var(--display);font-weight:900;font-size:17px}
#bRoll{right:96px;bottom:0;width:58px;height:58px}
#bUse{right:0;bottom:96px;width:58px;height:58px}
#bSwap{right:78px;bottom:78px;width:50px;height:50px;font-size:12px}

#placeBar{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);display:flex;gap:8px;align-items:center;background:#0d130fe6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
#placeBar button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 14px}
#placeOk{background:var(--accent)!important;color:#1b1407;border-color:var(--accent)!important;font-weight:700}
#placeOk.demo{background:#c95b5b!important;border-color:#c95b5b!important;color:#fff}
#placeBar{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}#placeName,#placeBar button{white-space:nowrap}
#placeHint{color:var(--mute);font-size:11px;flex-basis:100%;order:9;text-align:center}body.touch #placeHint{display:none}
#hotbar.build{border-color:var(--accent)}.hs.no{opacity:.45}
body.touch #placeBar{bottom:calc(env(safe-area-inset-bottom,0px) + 220px)}
/* hotbar: one row at the bottom on desktop, a 4×2 grid above the weapon tag on touch (the right side is taken by the buttons) */
#hotbar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;padding:4px;background:#0d130fb3;border:1px solid #ffffff1f;border-radius:10px}
.hs{position:relative;width:46px;height:46px;border:1px solid #ffffff26;border-radius:7px;background:#00000059;display:grid;place-items:center;align-content:center;gap:2px;padding:0;color:var(--ink);touch-action:none}
.hs.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#e0a64626}
.hs kbd{position:absolute;left:3px;top:1px;border:0;padding:0;font-size:9px}
.hs .sw{width:16px;height:16px;border-radius:4px}.hs .ico{width:22px;height:22px}
.hs .hn{font-size:10px;line-height:1;white-space:nowrap;overflow:hidden;max-width:42px}
.hs small{position:absolute;right:3px;top:1px;font-size:9px;color:var(--mute);font-variant-numeric:tabular-nums}
body.touch #hotbar{left:calc(env(safe-area-inset-left,0px) + 10px);transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);display:grid;grid-template-columns:repeat(4,38px)}
body.touch .hs{width:38px;height:38px}body.touch .hs kbd{display:none}

/* panels */
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#05080699;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{width:min(640px,100%);max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px #000a;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:4px;padding:10px 10px 0 16px;border-bottom:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:900;font-size:18px;margin:0 12px 8px 0;letter-spacing:.06em}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 10px 9px;color:var(--mute);font-size:14px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--mute);padding:4px 10px 10px}
.body{overflow-y:auto;padding:14px 16px 18px;min-height:0}
.note{font-size:12px;color:var(--mute);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.card h3 em{font-style:normal;font-size:11px;color:var(--mute);font-weight:400}
.card p{margin:0;font-size:12px;color:var(--mute);line-height:1.45}
.costs{display:flex;flex-wrap:wrap;gap:4px}
.cost{font-size:11px;padding:2px 6px;border-radius:4px;background:#00000040;font-variant-numeric:tabular-nums}
.cost.ok{color:var(--good)} .cost.no{color:var(--bad)}
.act{margin-top:auto;border:1px solid var(--line);background:#2c372f;border-radius:7px;padding:6px;font-size:13px}
.act.go{background:var(--accent);border-color:var(--accent);color:#1b1407;font-weight:700}
.act:disabled{opacity:.45;cursor:default}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}
.sw{width:22px;height:22px;border-radius:5px;flex:none;box-shadow:inset 0 -3px 0 #0004}
.ico{width:24px;height:24px;flex:none;display:block;filter:drop-shadow(0 1px 1px #0008)}
.card h3 .ico{display:inline-block;vertical-align:-6px;margin-right:6px}
.slot .n{flex:1;min-width:0;font-size:13px}
.slot .n small{display:block;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.slot button{border:1px solid var(--line);background:#2c372f;border-radius:6px;padding:4px 8px;font-size:12px}
.slot button.on{background:var(--accent);color:#1b1407;border-color:var(--accent)}
.slot{flex-wrap:wrap}
.fbar{height:8px;border-radius:4px;background:#2c372f;overflow:hidden;margin:4px 0 8px}.fbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3a,#ffd27a)}
.fzh{margin:12px 0 6px;font-size:13px}
.inv.fz{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.bs{position:relative;aspect-ratio:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:grid;place-items:center;align-content:center;gap:3px;padding:2px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:var(--ink)}
.bs .sw{width:22px;height:22px;border-radius:5px}.bs .ico{width:28px;height:28px}
.bs .hn{font-size:11px;line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bs small{position:absolute;right:4px;bottom:2px;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.bs em{position:absolute;left:4px;top:2px;font-style:normal;font-size:9px;color:var(--accent)}
.bs.held{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bs.over{border-color:#9fe07a;background:#9fe07a22}
.bs.empty{cursor:default;background:#00000033}
.phot{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px}
.phot .bs kbd{position:absolute;left:4px;top:2px;border:0;padding:0;font-size:9px}
.photh{margin:14px 0 0;font-size:12px;color:var(--mute)}
#bagMenu{position:fixed;z-index:30;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #000a;padding:6px;display:grid;gap:4px}
#bagMenu b{font-size:13px;padding:2px 6px}#bagMenu p{margin:0 6px 4px;font-size:11px;color:var(--mute)}
#bagMenu button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 10px;font-size:13px}
#bagMenu button.danger{border-color:#6b3a33;background:#2a1714;color:#f0b4a8}
.dragGhost{position:fixed;z-index:40;pointer-events:none;width:52px;height:52px;margin:-26px 0 0 -26px;opacity:.85}
.help{display:grid;gap:14px;font-size:13px;line-height:1.6}
.help h4{margin:0 0 4px;font-family:var(--display);font-size:14px;color:var(--accent);letter-spacing:.05em}
.help ul{margin:0;padding-left:18px;color:var(--ink)}
.help li{margin:2px 0}
.danger{border:1px solid #6b3a33;background:#2a1714;color:#f0b4a8;border-radius:7px;padding:7px 12px;font-size:13px;justify-self:start}

#intro .sheet{padding:26px 24px 22px;gap:14px;max-width:460px;background:radial-gradient(120% 80% at 50% 0%,#2a2416 0%,var(--panel) 60%)}
#intro h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,11vw,60px);letter-spacing:.14em;margin:0;line-height:1.05;color:var(--ink);text-shadow:0 0 30px #e0a64640}
#intro .sub{margin:0;font-size:14px;color:var(--mute);line-height:1.6}
#intro .row{display:flex;gap:8px;flex-wrap:wrap}
#intro .act{padding:10px 18px;font-size:15px;margin:0}
.rune{font-family:var(--display);color:var(--accent);letter-spacing:.5em;font-size:12px}
.ctl{font-size:12px;color:var(--mute);line-height:1.8;border-top:1px solid var(--line);padding-top:10px}
.namein{flex:1 1 140px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 12px;font:inherit;font-size:15px;color:var(--ink)}
.namein:focus{outline:2px solid var(--accent);outline-offset:1px}
#introNet{font-size:13px;color:var(--accent2);line-height:1.7;margin:0}
#introNet b{color:var(--ink);user-select:text;-webkit-user-select:text}
@media (prefers-reduced-motion:reduce){.bar i,#toast,#banner{transition:none}}
</style>

<canvas id="game"></canvas>

<div class="hud" id="stats">
  <div class="bar"><i id="hpFill"></i><span id="hpTxt"></span></div>
  <div class="bar st"><i id="stFill"></i></div>
  <div id="foods"></div>
  <div id="buffs"></div>
  <div id="petHud"></div>
  <canvas id="mini" width="280" height="280" aria-label="小地圖（點一下或按 M 開大地圖）"></canvas>
</div>
<div class="hud" id="top"><div id="clock"></div><div id="goal"></div></div>
<div class="hud" id="topr"><button class="chip-btn" id="btnBuild" type="button">建造 <kbd>B</kbd></button><button class="chip-btn" id="btnPanel" type="button">背包・製作 <kbd>Tab</kbd></button></div>
<div class="hud" id="weaponTag"></div>
<div id="hotbar" aria-label="快捷欄"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="bossBar" hidden><span>灰鬃狼王</span><div class="bar"><i id="bossFill"></i></div></div>
<div class="hud" id="banner"></div>

<div id="touch" hidden>
  <div id="stick"><i></i></div>
  <div id="pad">
    <button class="tb" id="bAtk" type="button">攻擊</button>
    <button class="tb" id="bRoll" type="button">翻滾</button>
    <button class="tb" id="bUse" type="button">互動</button>
    <button class="tb" id="bSwap" type="button">切換</button>
  </div>
</div>

<div id="placeBar" hidden><span id="placeName"></span><span id="placeCost" class="costs"></span><small id="placeHint"></small><button id="placeRot" type="button" hidden>轉向</button><button id="placeOk" type="button">放置</button><button id="placeCancel" type="button">完成</button></div>

<div class="modal" id="panel" hidden>
  <div class="sheet" role="dialog" aria-label="背包與製作">
    <header>
      <h2 id="panelTitle">行囊</h2>
      <button class="tab on" data-tab="craft" type="button">製作</button>
      <button class="tab" data-tab="inv" type="button">背包</button>
      <button class="tab" data-tab="pets" type="button">寵物</button>
      <button class="tab" data-tab="help" type="button">說明</button>
      <button class="x" id="panelX" type="button" aria-label="關閉">×</button>
    </header>
    <div class="body" id="panelBody"></div>
  </div>
</div>

<div class="modal" id="intro">
  <div class="sheet">
    <div class="rune">ᚾ ᛟ ᚱ ᛞ</div>
    <h1>北境求生</h1>
    <p class="sub">你在一片陌生的草原醒來。砍樹、撿燧石、蓋營火、吃飽肚子熬過夜晚，然後在石祭壇喚醒灰鬃狼王。</p>
    <p id="introNet" hidden></p>
    <div class="row" id="introBtns"></div>
    <div class="ctl" id="introCtl"></div>
  </div>
</div>

<div class="modal" id="bigmap" hidden>
  <div class="sheet" role="dialog" aria-label="地圖">
    <header><h2>地圖</h2><button class="x" id="mapX" type="button" aria-label="關閉">×</button></header>
    <canvas id="bigCv" width="640" height="640"></canvas>
    <div class="legend"><span><i style="background:#ffe08a"></i>你</span><span><i style="background:#5a8ab0"></i>其他玩家</span><span><i style="background:#e0a646;transform:rotate(45deg)"></i>石祭壇</span><span><i style="background:#ff8a3a"></i>營火</span><span><i style="background:#c9a26a"></i>工作台</span><span><i style="background:#c95b5b"></i>床</span><span><i style="background:#3d2a17"></i>木牆</span><span><i style="background:#b8bcb6"></i>石牆</span><span><i style="background:#d0603a"></i>熔爐</span><span><i style="background:#0b1a22;outline:1px solid #ffffff40"></i>還沒去過</span><span><kbd>M</kbd> 或 <kbd>Esc</kbd> 關閉</span></div>
  </div>
</div>

<div class="modal" id="dead" hidden>
  <div class="sheet" style="padding:24px;gap:12px;max-width:360px;text-align:center">
    <h2 style="font-family:var(--display);font-size:28px;margin:0;letter-spacing:.1em">你倒下了</h2>
    <p class="note" style="margin:0">食物效果消失，背包物品保留。你會在床邊（或出生點）醒來。</p>
    <button class="act go" id="respawn" type="button">重新站起</button>
  </div>
</div>

<div class="modal" id="netbox" hidden>
  <div class="sheet" style="padding:24px;max-width:380px;text-align:center"><p class="sub" id="netTxt" style="margin:0;line-height:1.6"></p></div>
</div>

<script>
(()=>{
'use strict';
/* ---------- setup ---------- */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
const $=id=>document.getElementById(id);
const TOUCH=matchMedia('(pointer:coarse)').matches;

/* ---------- noise ---------- */
function hash(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,seed),b=hash(xi+1,yi,seed),c=hash(xi,yi+1,seed),d=hash(xi+1,yi+1,seed);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);n+=a;f*=2;a*=.5}return s/n}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const seen=new Uint8Array(COLS*ROWS),fogImg=document.createElement('canvas');fogImg.width=COLS;fogImg.height=ROWS;
const fctx=fogImg.getContext('2d'),FOG_R=6;
function resetFog(){seen.fill(0);fctx.fillStyle='#0b1a22';fctx.fillRect(0,0,COLS,ROWS)}
resetFog();
function reveal(x,y){const i0=Math.floor(x/CELL),j0=Math.floor(y/CELL);
  for(let j=j0-FOG_R;j<=j0+FOG_R;j++)for(let i=i0-FOG_R;i<=i0+FOG_R;i++){if(i<0||j<0||i>=COLS||j>=ROWS||(i-i0)**2+(j-j0)**2>FOG_R*FOG_R)continue;
    const c=j*COLS+i;if(!seen[c]){seen[c]=1;fctx.clearRect(i,j,1,1)}}}
function packSeen(){let s='';for(let b=0;b<seen.length;b+=8){let v=0;for(let k=0;k<8;k++)if(seen[b+k])v|=1<<k;s+=String.fromCharCode(v)}return btoa(s)}
function unpackSeen(str){resetFog();let s;try{s=atob(str)}catch(e){return}
  for(let b=0;b<s.length;b++){const v=s.charCodeAt(b);for(let k=0;k<8;k++)if(v>>k&1){const c=b*8+k;if(c<seen.length){seen[c]=1;fctx.clearRect(c%COLS,Math.floor(c/COLS),1,1)}}}}

const ME=0,others=new Map();

const ci=(x,y)=>{const i=Math.floor(x/CELL),j=Math.floor(y/CELL);return(i<0||j<0||i>=COLS||j>=ROWS)?-1:j*COLS+i};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
function isWater(x,y){const c=ci(x,y);return c<0||biome[c]===0}

/* ---------- world gen ---------- */
function genWorld(){
  const R=mulberry(seed);
  for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
    const x=(i+.5)*CELL,y=(j+.5)*CELL,dx=(x-W/2)/(W/2),dy=(y-H/2)/(H/2),d=Math.hypot(dx,dy);
    let e=fbm(x/430,y/430,4)+.2-Math.pow(d,4)*.85;
    if(d<.1)e=Math.max(e,.55);
    const f=fbm(x/330+71.3,y/330+19.7,3);
    const c=j*COLS+i;cellH[c]=e;
    biome[c]=e<.37?0:(f>.53&&d>.16)?3:2;
  }
  const sand=[];
  for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const c=j*COLS+i;if(biome[c]===0)continue;
    let w=false;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const ii=i+a,jj=j+b;if(ii<0||jj<0||ii>=COLS||jj>=ROWS||biome[jj*COLS+ii]===0)w=true}
    if(w)sand.push(c)}
  for(const c of sand)biome[c]=1;
  for(let c=0;c<COLS*ROWS;c++){const v=hash(c,7,seed),b=biome[c];
    cellCol[c]=b===0?`hsl(${200+v*6},${38+v*6}%,${Math.max(13,26-(.37-cellH[c])*70)+v*2}%)`:
      b===1?`hsl(${40+v*6},${30+v*8}%,${52+v*5}%)`:
      b===2?`hsl(${84+v*14},${30+v*10}%,${31+v*6}%)`:`hsl(${112+v*14},${22+v*8}%,${18+v*4}%)`;}
  // altar
  for(let k=0;k<400&&!altar;k++){const a=R()*Math.PI*2,rr=W*(.27+R()*.08),x=W/2+Math.cos(a)*rr,y=H/2+Math.sin(a)*rr;
    let ok=true;for(let u=-3;u<=3&&ok;u++)for(let v=-3;v<=3;v++)if(isWater(x+u*CELL,y+v*CELL)){ok=false;break}
    if(ok){const c=ci(x,y);altar={k:'altar',x:(c%COLS+.5)*CELL,y:(Math.floor(c/COLS)+.5)*CELL,cell:c}}}
  if(!altar)altar={k:'altar',x:W/2+600,y:H/2,cell:ci(W/2+600,H/2)};
  // resources
  for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++){const c=j*COLS+i,b=biome[c];if(b===0)continue;
    const x=(i+.5)*CELL+(R()-.5)*16,y=(j+.5)*CELL+(R()-.5)*16;
    if(Math.hypot(x-W/2,y-H/2)<70||Math.hypot(x-altar.x,y-altar.y)<150)continue;
    const r=R();let k=null;
    if(b===3)k=r<.42?'pine':r<.5?'tree':r<.55?'rock':r<.61?'shroom':r<.64?'pebble':null;
    else if(b===2)k=r<.085?'tree':r<.125?'bush':r<.17?'pebble':r<.19?'rock':r<.2?'flint':null;
    else k=r<.2?'flint':r<.3?'pebble':null;
    if(k)addRes(k,x,y,c);}
  // ore veins: placed with hash/noise only (no R() calls) so the rest of an existing world stays the same; iron only far from spawn
  for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++){const c=j*COLS+i;if(biome[c]<2||resGrid[c]||c===altar.cell)continue;
    const x=(i+.5)*CELL,y=(j+.5)*CELL,d=Math.hypot(x-W/2,y-H/2)/(W/2);if(d<.2||Math.hypot(x-altar.x,y-altar.y)<150)continue;
    if(vnoise(x/210+33.1,y/210+51.7)<.8||hash(c,11,seed)>.45)continue;
    const t=hash(Math.floor(x/360),Math.floor(y/360),seed+5),k=t<.3?'coal':t<.52?'copper':t<.74?'tin':d>.4?'iron':'coal'; // one ore type per 9×9-cell region
    addRes(k,x+(hash(c,12,seed)-.5)*14,y+(hash(c,13,seed)-.5)*14,c)}
  // guaranteed starter kit near spawn
  const kit=[['flint',4],['pebble',5],['tree',8],['bush',3]];
  for(const[k,n]of kit)for(let m=0;m<n;m++)for(let t=0;t<30;t++){const a=R()*6.28,rr=110+R()*260,x=W/2+Math.cos(a)*rr,y=H/2+Math.sin(a)*rr,c=ci(x,y);if(c>=0&&biome[c]&&!resGrid[c]){addRes(k,x,y,c);break}}
  const oreKit=[['coal',3],['copper',2],['tin',2]];
  for(const[k,n]of oreKit)for(let m=0;m<n;m++)for(let t=0;t<30;t++){const a=R()*6.28,rr=380+R()*320,x=W/2+Math.cos(a)*rr,y=H/2+Math.sin(a)*rr,c=ci(x,y);if(c>=0&&biome[c]>=2&&!resGrid[c]){addRes(k,x,y,c);break}}
  // terrain image for the maps: one pixel per cell
  const g=mapImg.getContext('2d');for(let c=0;c<COLS*ROWS;c++){g.fillStyle=cellCol[c];g.fillRect(c%COLS,Math.floor(c/COLS),1,1)}
}
function addRes(k,x,y,c){const o={k,x,y,cell:c,hp:RES[k].hp,flash:0,dep:0,sz:.85+hash(c,3,seed)*.35};resGrid[c]=o;return o}

/* ---------- mobs ---------- */
function findSpot(cx,cy,minD,maxD,want){for(let t=0;t<40;t++){const a=Math.random()*6.28,r=rnd(minD,maxD),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,c=ci(x,y);if(c<0)continue;const b=biome[c];if(b===0||resGrid[c]&&RES[resGrid[c].k].solid||structGrid[c])continue;if(want&&!want.includes(b))continue;return{x,y}}return null}
function makeMob(k,x,y){const base={boar:{hp:26,r:13,spd:36},moss:{hp:20,r:11,spd:78},boss:{hp:480,r:30,spd:100}}[k];
  return{id:++mobSeq,k,x,y,tx:x,ty:y,hp:base.hp,max:base.hp,r:base.r,spd:base.spd,face:Math.random()*6.28,wt:0,wx:0,wy:0,aggro:0,acd:0,kx:0,ky:0,flash:0,state:'chase',t:0,dashT:3,howlT:9,hitDash:false,anim:Math.random()*9}}
function spawnMob(k,x,y){const m=makeMob(k,x,y);mobs.push(m);return m}
function populate(){
  for(let n=0;n<24;n++){const s=findSpot(W/2,H/2,350,1500,[2]);if(s)spawnMob('boar',s.x,s.y)}
  for(let n=0;n<14;n++){const s=findSpot(W/2,H/2,600,1500,[3]);if(s)spawnMob('moss',s.x,s.y)}
}

/* ---------- load / save ---------- */
// solo keeps everything in SKEY; in multiplayer the host keeps the world (WKEY) and every player keeps their own bag per world+name
function worldData(){return{seed,day,dayT,flags:{summoned:flags.summoned,boss:flags.boss},structs:structs.map(s=>({k:s.k,x:s.x,y:s.y,o:s.o,fz:s.fz}))}}
function personal(){return{inv,foods,ate,spawn:spawnPt,p:{x:P.x,y:P.y,hp:P.hp,w:P.weapon},hot,hotSel,
  pets:pets.map(p=>({id:p.id,k:p.k,name:p.name,hp:p.hp,bag:p.bag,down:p.down})),petOut,seen:packSeen()}}
function pkey(){return`northland-mp-p-${seed}-${myName}`}
function writeSave(){if(!ready)return;try{
  if(MODE==='solo'){const w=worldData();w.flags.ate=ate;localStorage.setItem(SKEY,JSON.stringify(Object.assign(personal(),w)))}
  else{if(MODE==='host')localStorage.setItem(WKEY,JSON.stringify(worldData()));if(started)localStorage.setItem(pkey(),JSON.stringify(personal()))}}catch(e){}}
function resetSave(){try{localStorage.removeItem(MODE==='host'?WKEY:SKEY)}catch(e){}location.reload()}
function applyWorld(s){day=s.day||1;dayT=s.dayT||.05;if(s.flags){flags.summoned=!!s.flags.summoned;flags.boss=!!s.flags.boss}
  // 舊存檔的木牆在格子中央、沒有方向：上下有鄰居的在左緣放直牆，左右有鄰居（或沒鄰居）的在下緣放橫牆，轉角兩種都放，圍起來的地方才不會漏
  const old=new Set((s.structs||[]).filter(st=>st.k==='wall'&&!st.o).map(st=>ci(st.x,st.y)));
  for(const st of s.structs||[]){
    if(st.k!=='wall'||st.o){addStruct(st.k,st.x,st.y,st.o,st.fz);continue}
    const c=ci(st.x,st.y);if(c<0)continue;const v=old.has(c-COLS)||old.has(c+COLS),h=old.has(c-1)||old.has(c+1);
    if(v)addWall('wall',st.x-CELL/2,st.y,'v');if(h||!v)addWall('wall',st.x,st.y+CELL/2,'h')}
  if(flags.summoned&&!flags.boss)flags.summoned=false}
function applyPersonal(s){inv=s.inv||{};foods=(s.foods||[]).filter(f=>FOODS[f.k]);ate=!!(s.ate||s.flags&&s.flags.ate);spawnPt=s.spawn||spawnPt;
  if(s.p){P.x=s.p.x;P.y=s.p.y;P.hp=s.p.hp||25;P.weapon=WEAPONS[s.p.w]?s.p.w:'none'}
  // older saves have no hotbar: fill it from the bag and select the weapon that was in hand
  if(Array.isArray(s.hot)&&s.hot.length===HOT_N){hot=s.hot.map(k=>typeof k==='string'&&ITEM[k]?k:null);hotSel=Math.min(HOT_N-1,Math.max(0,s.hotSel|0))}
  else{hotDefault();hotSel=Math.max(0,hot.indexOf(P.weapon))}syncHeld();
  pets=(s.pets||[]).filter(p=>PETS[p.k]).map(p=>({id:p.id,k:p.k,name:p.name,hp:p.hp>0?p.hp:PETS[p.k].hp,bag:p.bag||{},down:p.down||0}));
  petOut=pets.some(p=>p.id===s.petOut)?s.petOut:null;const cp=curPet();if(cp)placePet(cp,false);
  if(s.seen)unpackSeen(s.seen)}
function bootSolo(){MODE='solo';save=loadKey(SKEY);seed=save&&save.seed||((Math.random()*2e9)|0);genWorld();if(save){applyWorld(save);applyPersonal(save)}populate();ready=true;setupIntro()}
function bootHost(){save=loadKey(WKEY);seed=save&&save.seed||((Math.random()*2e9)|0);genWorld();if(save)applyWorld(save);populate();ready=true;setupIntro()}
function bootClient(m){seed=m.seed;genWorld();resGrid.fill(null);const RK=Object.keys(RES);
  for(const[c,ki,x,y,hp,dep]of m.res){const o=addRes(RK[ki],x,y,c);o.hp=hp;o.dep=dep}
  for(const[k,x,y,o,fz]of m.structs)addStruct(k,x,y,o||undefined,fz||undefined);
  loots=(m.loots||[]).map(([id,x,y,bag])=>({id,x,y,bag}));
  day=m.day;dayT=m.dt;flags.summoned=m.fs;flags.boss=m.fb;ready=true;setupIntro()}
function addStruct(k,x,y,o,fz){if(isWallK(k))return addWall(k,x,y,o);const c=ci(x,y);if(c<0)return;if(resGrid[c])resGrid[c]=null;const s={k,x,y,cell:c,anim:Math.random()*9};
  if(k==='furnace')s.fz=normFz(fz);structs.push(s);structGrid[c]=s;return s}
// furnace contents: q = ore waiting, fuel = coal waiting, out = ingots ready, burn = seconds left on the lit coal, prog = seconds into the current ore
function normFz(f){f=f||{};return{q:Object.assign({},f.q),fuel:f.fuel||0,out:Object.assign({},f.out),burn:f.burn||0,prog:f.prog||0}}
// 牆（木牆、石牆）貼在格子的邊上：o='h' 在格子的上緣，o='v' 在格子的左緣，記在 wallH/wallV[該格]
function wallCell(o,x,y){const i=o==='v'?Math.round(x/CELL):Math.floor(x/CELL),j=o==='v'?Math.floor(y/CELL):Math.round(y/CELL);return(i<0||j<0||i>=COLS||j>=ROWS)?-1:j*COLS+i}
function snapWall(o,x,y){const c=wallCell(o,x,y),i=c%COLS,j=Math.floor(c/COLS);return o==='v'?{x:i*CELL,y:(j+.5)*CELL,c,o}:{x:(i+.5)*CELL,y:j*CELL,c,o}}
function addWall(k,x,y,o){if(o!=='v')o='h';const g=snapWall(o,x,y),grid=o==='v'?wallV:wallH;if(g.c<0||grid[g.c])return;
  const s={k,x:g.x,y:g.y,o,cell:g.c,anim:0};structs.push(s);grid[g.c]=s;return s}

/* ---------- collision ---------- */
const SOLID_S={wall:21,swall:21,bench:17,bed:16,fire:11,furnace:17},WALL_T=6;
function wallHit(w,x,y,r){const T=WALL_T+r,L=CELL/2+r;return w.o==='v'?Math.abs(x-w.x)<T&&Math.abs(y-w.y)<L:Math.abs(y-w.y)<T&&Math.abs(x-w.x)<L}
function blocked(x,y,r){
  if(isWater(x,y)||isWater(x+r*.7,y)||isWater(x-r*.7,y)||isWater(x,y+r*.7)||isWater(x,y-r*.7))return true;
  const i0=Math.floor(x/CELL),j0=Math.floor(y/CELL),sp=r>20?2:1;
  for(let j=j0-sp;j<=j0+sp;j++)for(let i=i0-sp;i<=i0+sp;i++){if(i<0||j<0||i>=COLS||j>=ROWS)continue;const c=j*COLS+i;
    const o=resGrid[c];if(o){const s=RES[o.k].solid;if(s&&Math.hypot(o.x-x,o.y-y)<s*o.sz+r)return true}
    const st=structGrid[c];if(st){const s=SOLID_S[st.k];if(s&&Math.hypot(st.x-x,st.y-y)<s+r)return true}
    if(wallH[c]&&wallHit(wallH[c],x,y,r)||wallV[c]&&wallHit(wallV[c],x,y,r))return true}
  if(Math.hypot(altar.x-x,altar.y-y)<26+r)return true;
  return false}
function move(e,dx,dy){if(dx&&!blocked(e.x+dx,e.y,e.r))e.x+=dx;if(dy&&!blocked(e.x,e.y+dy,e.r))e.y+=dy}

/* ---------- player stats ---------- */
function foodVal(f,key){const d=FOODS[f.k];return d[key]*Math.min(1,f.t/(d.t*.4))}
function maxHp(){return 25+foods.reduce((s,f)=>s+foodVal(f,'hp'),0)}
function maxSt(){return 50+foods.reduce((s,f)=>s+foodVal(f,'st'),0)}
const has=k=>(inv[k]||0)>0;
function give(k,n,x,y,toPet){if(n<=0)return;const cp=toPet&&curPet();
  if(cp){cp.bag[k]=(cp.bag[k]||0)+n;floats.push({x:x??cp.x,y:(y??cp.y)-18,txt:`+${n} ${k}`,t:1.2,col:'#bfe3a0'});return}
  inv[k]=(inv[k]||0)+n;hotAdd(k);floats.push({x:x??P.x,y:(y??P.y)-18,txt:`+${n} ${k}`,t:1.4,col:ITEM[k]||'#fff'})}
function take(cost){for(const k in cost)inv[k]-=cost[k]}
function afford(cost){for(const k in cost)if((inv[k]||0)<cost[k])return false;return true}
function nearBench(){return structs.some(s=>s.k==='bench'&&dist(s,P)<240)}
function isNight(){return dayT>.66}
function darkness(){const t=dayT;if(t<.58)return 0;if(t<.68)return(t-.58)/.1*.74;if(t<.94)return .74;return(1-(t-.94)/.06)*.74}

/* ---------- toast & banner ---------- */
let toastT=0,bannerT=0;
function toast(s){$('toast').textContent=s;$('toast').classList.add('on');toastT=2.2}
function banner(h,sub){$('banner').innerHTML=h+(sub?`<small>${sub}</small>`:'');$('banner').classList.add('on');bannerT=4}

/* ---------- input ---------- */
const keys={};let mouse={x:0,y:0,on:false},atkHeld=false,joy={id:null,ox:0,oy:0,dx:0,dy:0};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Tab'||e.key==='i'||e.key==='I'){e.preventDefault();if(!$('intro').hidden)return;togglePanel();return}
  if(e.key==='Escape'){if(!$('bigmap').hidden)toggleMap(false);else if(!$('panel').hidden)togglePanel(false);else if(placing)stopPlace();return}
  if(e.code==='KeyM'){toggleMap();return}
  if(paused)return;
  if(e.code==='KeyR'&&placing){rotPlace();return}
  if(e.code==='KeyB'){toggleBuild();return}
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();doRoll()}
  if(e.code==='KeyE')doUse();
  if(e.code==='KeyQ'){if(placing)selectBuild(buildSel+1);else hotNext()}
  if(/^Digit[1-8]$/.test(e.code)){if(placing)selectBuild(+e.code[5]-1);else hotSelect(+e.code[5]-1)}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;atkHeld=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(paused)return;
  if(e.pointerType==='mouse'){mouse.on=true;mouse.x=e.clientX;mouse.y=e.clientY;
    if(e.button===2){if(placing)doDemolish();else doRoll();return}
    if(placing){tryPlace();return}
    if(useHeld())return;atkHeld=true;return}
  if(joy.id===null&&e.clientX<VW*.55){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;const s=$('stick');s.style.display='block';s.style.left=joy.ox+'px';s.style.top=joy.oy+'px';s.firstElementChild.style.transform='';cv.setPointerCapture(e.pointerId)}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){mouse.on=true;mouse.x=e.clientX;mouse.y=e.clientY;return}
  if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),m=52;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.dx=dx/m;joy.dy=dy/m;$('stick').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`}
});
function endPtr(e){if(e.pointerType==='mouse'){atkHeld=false;return}if(e.pointerId===joy.id){joy.id=null;joy.dx=joy.dy=0;$('stick').style.display='none'}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
function tbtn(id,down,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('down');if(!paused)down()});const u=e=>{b.classList.remove('down');up&&up()};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u)}
tbtn('bAtk',()=>{if(placing)tryPlace();else if(!useHeld())atkHeld=true},()=>{atkHeld=false});
tbtn('bRoll',doRoll);tbtn('bUse',doUse);tbtn('bSwap',hotNext);
cv.addEventListener('wheel',e=>{if(paused)return;e.preventDefault();const d=e.deltaY>0?1:-1;if(placing)selectBuild(buildSel+d);else hotSelect(hotSel+d)},{passive:false});
$('hotbar').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hs]');if(!b)return;e.preventDefault();e.stopPropagation();if(paused)return;if(placing)selectBuild(+b.dataset.hs);else hotSelect(+b.dataset.hs)});
$('btnBuild').addEventListener('click',()=>{if(!paused)toggleBuild()});
$('btnPanel').addEventListener('click',()=>togglePanel());
$('placeOk').addEventListener('click',tryPlace);$('placeRot').addEventListener('click',rotPlace);$('placeCancel').addEventListener('click',stopPlace);
$('panelX').addEventListener('click',()=>togglePanel(false));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{panelTab=t.dataset.tab;renderPanel()}));
$('panel').addEventListener('pointerdown',e=>{if(e.target.id==='panel')togglePanel(false)});

/* ---------- actions ---------- */
function worldMouse(){return{x:(mouse.x-VW/2)/SCALE+cam.x,y:(mouse.y-VH/2)/SCALE+cam.y}}
function doRoll(){if(P.roll>0||P.st<14||placing)return;P.st-=14;P.stDelay=.9;P.roll=.32;
  let dx=0,dy=0;if(TOUCH){dx=joy.dx;dy=joy.dy}else{dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)}
  if(!dx&&!dy){dx=Math.cos(P.face);dy=Math.sin(P.face)}const l=Math.hypot(dx,dy);P.rdx=dx/l;P.rdy=dy/l}
/* ---------- hotbar ---------- */
// 8 slots; the selected slot is what you hold. Weapons and tools set P.weapon, food in the selected slot is eaten on attack
const HOT_N=8;let hot=new Array(HOT_N).fill(null),hotSel=0,hotSig='';
function hotAdd(k){if(!(WEAPONS[k]||FOODS[k])||hot.includes(k))return;const i=hot.indexOf(null);if(i>=0)hot[i]=k} // new weapons/food fill the first empty slot
function hotPut(k){const i=hot.indexOf(k);if(i>=0)hot[i]=null;hot[hotSel]=k;syncHeld()}                       // bag button: into the selected slot
const held=()=>hot[hotSel];
function syncHeld(){for(let i=0;i<HOT_N;i++)if(hot[i]&&!has(hot[i]))hot[i]=null;const k=hot[hotSel];P.weapon=WEAPONS[k]?k:'none'}
function hotSelect(i,quiet){hotSel=(i+HOT_N)%HOT_N;syncHeld();if(!quiet)toast(`${hotSel+1}：${held()||'空手'}`)}
function hotNext(){for(let d=1;d<=HOT_N;d++){const i=(hotSel+d)%HOT_N;if(hot[i]){hotSelect(i);return}}toast('快捷欄是空的')}
function useHeld(){const k=held();if(!FOODS[k])return false;eat(k);syncHeld();return true}
function hotDefault(){hot=new Array(HOT_N).fill(null);for(const k of [...Object.keys(WEAPONS),...Object.keys(FOODS)])if(k!=='none'&&has(k))hotAdd(k)}
function renderHot(){const hb=$('hotbar');
  // build mode: each slot shows how many more you can build; the place bar shows what the selected one needs and what you have left
  if(placing){const L=buildList(),ns=L.map(r=>r===DEMOLISH?-1:buildN(r)),pc=placing===DEMOLISH?'':placeCostHtml(placing),sig=JSON.stringify(['b',buildSel,ns,pc]);if(sig===hotSig)return;hotSig=sig;hb.classList.add('build');$('placeCost').innerHTML=pc;
    hb.innerHTML=L.map((r,i)=>`<button type="button" class="hs${r===placing?' on':''}${ns[i]===0?' no':''}" data-hs="${i}" title="${r.name}"><kbd>${i+1}</kbd>${ns[i]>=0?`<small>${ns[i]}</small>`:''}${icon(r.id)}<span class="hn">${r.name}</span></button>`).join('');return}
  hb.classList.remove('build');const sig=JSON.stringify([hot,hotSel,hot.map(k=>k&&inv[k])]);if(sig===hotSig)return;hotSig=sig;
  $('hotbar').innerHTML=hot.map((k,i)=>`<button type="button" class="hs${i===hotSel?' on':''}" data-hs="${i}" title="${k||'空'}"><kbd>${i+1}</kbd>${k?`${icon(k)}<span class="hn">${k}</span>${WEAPONS[k]?'':`<small>${inv[k]}</small>`}`:''}</button>`).join('')}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return Math.abs(d)}
function attack(){
  const w=WEAPONS[P.weapon];if(P.cd>0||P.roll>0)return;if(P.st<w.st){P.stDelay=Math.max(P.stDelay,.4);return}
  // touch auto-aim
  if(TOUCH){let best=null,bd=w.range+60;for(const m of mobs){const d=dist(m,P)-m.r;if(d<bd){bd=d;best=m}}
    if(!best){forCells(P.x,P.y,2,o=>{const d=dist(o,P);if(d<bd&&!(o.k==='bush'&&o.dep>0)){bd=d;best=o}})}
    if(best)P.face=Math.atan2(best.y-P.y,best.x-P.x)}
  P.cd=w.cd;P.swing=.24;P.st-=w.st;P.stDelay=.9;
  let hit=false;
  for(const m of [...mobs]){const d=dist(m,P);if(d<w.range+m.r&&angDiff(Math.atan2(m.y-P.y,m.x-P.x),P.face)<w.arc){const dmg=Math.round(w.dmg*(P.rest>0?1.1:1));
    floats.push({x:m.x,y:m.y-m.r-8,txt:String(dmg),t:.8,col:'#ffe9b8'});burst(m.x,m.y,m.k==='moss'?'#9fc069':'#b84a3a',6);shake=Math.max(shake,3);
    act({t:'hit',id:m.id,dmg,x:P.x,y:P.y});hit=true}}
  // 範圍攻擊：揮擊範圍內的樹、石頭、礦全部一起打；什麼都沒打到才撿最近的小東西
  const inArc=o=>{const d=dist(o,P)-(RES[o.k].solid||6)*o.sz;return d<w.range-4&&angDiff(Math.atan2(o.y-P.y,o.x-P.x),P.face)<w.arc+.3?d:-1};
  const big=[];let best=null,bd=1e9;
  forCells(P.x,P.y,2,o=>{const d=inArc(o);if(d<0)return;if(!RES[o.k].pick)big.push(o);else if(d<bd){bd=d;best=o}});
  if(big.length){for(const o of big)hitRes(o);return}
  if(!hit&&best)hitRes(best);
}
function forCells(x,y,sp,fn){const i0=Math.floor(x/CELL),j0=Math.floor(y/CELL);for(let j=j0-sp;j<=j0+sp;j++)for(let i=i0-sp;i<=i0+sp;i++){if(i<0||j<0||i>=COLS||j>=ROWS)continue;const o=resGrid[j*COLS+i];if(o)fn(o)}}
function bestTool(table){let b=0,k=null;for(const n in table){if((n==='none'||has(n))&&table[n]>b){b=table[n];k=n}}return[b,k]}
// local intent: tool checks use this player's bag, the world change itself goes through act()
function hitRes(o){const d=RES[o.k];let dmg=0;
  if(d.pick){if(o.k==='bush'&&o.dep>0){toast('莓果還沒長回來');return}}
  else if(d.mine){const need=d.tier||1;let m=0;for(const n in MINE)if(has(n)&&PICK_TIER[n]>=need)m=Math.max(m,MINE[n]);
    if(!m){toast(need>1?`需要銅鎬才能挖${d.name}`:`需要燧石鎬才能挖${d.name}`);o.flash=.15;return}dmg=m;shake=Math.max(shake,2)}
  else{dmg=bestTool(CHOP)[0];shake=Math.max(shake,2)}
  act({t:'res',c:o.cell,dmg})}
// world side (solo / host)
function worldRes(c,dmg,from,toPet){const o=resGrid[c];if(!o)return;const d=RES[o.k];
  if(d.pick){if(o.k==='bush'){if(o.dep>0)return;evt({t:'bd',c})}else removeRes(o);
    for(const[k,a,b]of d.drop)giveTo(from,k,ri(a,b),o.x,o.y,toPet);return}
  if(toPet)return;
  evt({t:'rh',c,hp:o.hp-dmg});
  if(o.hp<=0){for(const[k,a,b]of d.drop)giveTo(from,k,ri(a,b),o.x,o.y);removeRes(o)}}
function removeRes(o){evt({t:'rx',c:o.cell});regrow.push({k:o.k,x:o.x,y:o.y,cell:o.cell,at:time+(o.k==='rock'?400:RES[o.k].ore?600:o.k.length<5?260:200)})}
function hitMob(m,dmg,from,ax,ay,byPet){m.hp-=dmg;m.flash=.15;const a=Math.atan2(m.y-ay,m.x-ax),kb=m.k==='boss'?60:220;m.kx=Math.cos(a)*kb;m.ky=Math.sin(a)*kb;m.aggro=12;
  m.petT=byPet?{o:from,until:time+8}:null; // mobs only turn on a pet that hit them
  if(m.hp<=0)killMob(m,from)}
function killMob(m,from){const i=mobs.indexOf(m);if(i<0)return;mobs.splice(i,1);evt({t:'mk',id:m.id,x:m.x,y:m.y});
  if(m.k==='boar'){giveTo(from,'生肉',ri(1,2),m.x,m.y);if(Math.random()<.8)giveTo(from,'皮革',ri(1,2),m.x,m.y-14);if(Math.random()<.4)giveTo(from,'獠牙',1,m.x,m.y-28)}
  if(m.k==='moss'){giveTo(from,'樹脂',ri(1,2),m.x,m.y);if(Math.random()<.25)giveTo(from,'燧石',1,m.x,m.y-14)}
  if(m.k==='boss'){boss=null;flags.boss=true;giveAll('狼王之牙',1,m.x,m.y);giveAll('皮革',6,m.x,m.y-14);toAll({t:'pup'});evt({t:'bn',h:'狼王倒下了',s:'每個人都得到一隻狼崽・到工作台用狼王之牙打造狼牙劍'});writeSave()}}
function hitPlayer(dmg,src){if(P.roll>0||P.inv>0||P.dead)return;if(has('皮甲'))dmg*=.7;P.hp-=dmg;P.inv=.45;P.hurt=.25;shake=7;
  const a=Math.atan2(P.y-src.y,P.x-src.x);move(P,Math.cos(a)*14,Math.sin(a)*14);floats.push({x:P.x,y:P.y-26,txt:'-'+Math.round(dmg),t:.9,col:'#ff8a7a'});
  if(P.hp<=0){P.hp=0;die()}}
function die(){P.dead=true;paused=true;$('dead').hidden=false;$('bigmap').hidden=true;atkHeld=false}
$('respawn').addEventListener('click',()=>{foods=[];P.hp=25;P.st=50;P.rest=0;P.dead=false;const bed=MODE==='solo'&&structs.find(s=>s.k==='bed');const sp=bed?{x:bed.x,y:bed.y+34}:spawnPt;P.x=sp.x;P.y=sp.y;

  $('dead').hidden=true;paused=false;writeSave()});
function eat(k){if(!FOODS[k]||!has(k))return;if(foods.some(f=>f.k===k)){toast('同一種食物還在消化中');return}if(foods.length>=3){toast('肚子已經裝不下了');return}
  inv[k]--;foods.push({k,t:FOODS[k].t});P.hp=Math.min(maxHp(),P.hp+8);if(k==='烤肉')ate=true;toast(`吃了${k}：血量上限 +${FOODS[k].hp}，耐力上限 +${FOODS[k].st}`)}

function nearestUse(){let best=null,bd=1e9;
  for(const s of [...structs,altar]){const d=dist(s,P),lim=s.k==='altar'?84:62;if(d<lim&&d<bd&&!isWallK(s.k)){best={s};bd=d}}
  if(best)return best;
  for(const l of loots){const d=dist(l,P);if(d<46&&d<bd){bd=d;best={l}}}
  if(has('莓果'))for(const m of mobs)if(m.k==='boar'&&m.aggro<=0){const d=dist(m,P)-m.r;if(d<40&&d<bd){bd=d;best={m}}}
  if(best)return best;forCells(P.x,P.y,1,o=>{if(RES[o.k].pick&&!(o.k==='bush'&&o.dep>0)){const d=dist(o,P);if(d<46&&d<bd){bd=d;best={o}}}});return best}
function useLabel(u){if(!u)return null;if(u.o||u.l)return'撿起';if(u.m)return'餵莓果';const s=u.s;
  if(s.k==='fire')return has('生肉')?'烤肉':'取暖';if(s.k==='bed')return isNight()?'睡覺':'設為重生點';if(s.k==='bench')return'製作';if(s.k==='furnace')return'熔爐';

function doUse(){if(placing)return;const u=nearestUse();if(!u){toast('附近沒有可互動的東西');return}

// what the aim point is on: the closest wall edge or building in the 3×3 cells around it
function demoTarget(){const a=aimPt(),i0=Math.floor(a.x/CELL),j0=Math.floor(a.y/CELL);let best=null,bd=1e9;

    if(T&&isNight()&&mossN<5+Math.min(day,6)){const s=findSpot(T.x,T.y,480,620);if(s)spawnMob('moss',s.x,s.y)}

    if(!isNight())for(let i=mobs.length-1;i>=0;i--){const m=mobs[i];if(m.k==='moss'&&TG.every(t=>dist(m,t)>750)&&biome[ci(m.x,m.y)]!==3&&Math.random()<.3)mobs.splice(i,1)}}

  for(const s of structs)s.anim+=dt;

}
// solo / host: a lit coal burns down whether or not there is ore; a new coal is lit only when there is ore waiting
function tickFurnaces(dt){for(const s of structs){if(s.k!=='furnace')continue;const f=s.fz,busy=Object.values(f.q).some(n=>n>0);let ch=false;
  if(busy&&f.burn<=0&&f.fuel>0){f.fuel--;f.burn=COAL_T;ch=true}

    if(f.burn<=0){f.burn=0;ch=true}}

function updateLocal(dt){
  // input → movement
  let mx=0,my=0,sprint=false;
  if(TOUCH){mx=joy.dx;my=joy.dy;sprint=Math.hypot(mx,my)>.95}else{mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);sprint=keys.ShiftLeft||keys.ShiftRight}

  if(P.roll>0){P.roll-=dt;move(P,P.rdx*360*dt,P.rdy*360*dt)}
  else if(ml>.1){if(ml>1){mx/=ml;my/=ml}let spd=118;if(sprint&&P.st>1){spd=185;P.st-=11*dt;P.stDelay=.6}P.walk+=dt*(spd/14);move(P,mx*spd*dt,my*spd*dt)}

    if(d<m.r+T.r+8&&m.acd<=0){hurt(T,11,m);m.acd=1.2}
    m.dashT-=dt;if(m.dashT<=0&&d<340){m.state='wind';m.t=.7;m.face=a}}
  else if(m.state==='wind'){m.t-=dt;m.face=a;if(m.t<=0){m.state='dash';m.t=.42;m.hitDash=false}}
  else if(m.state==='dash'){m.t-=dt;move(m,Math.cos(m.face)*500*dt,Math.sin(m.face)*500*dt);if(!m.hitDash&&d<m.r+T.r+6){hurt(T,18,m);m.hitDash=true}
    if(m.t<=0){m.state='chase';m.dashT=rnd(2.2,3.6)}}
}

/* ---------- pets ---------- */
// each player simulates their own summoned pet locally (like the player); its hits/pickups go through act()
const curPet=()=>pets.find(p=>p.id===petOut&&p.down<=0)||null;
function petOf(owner){if(owner===ME){const p=curPet();return p&&!P.dead?p:null}const o=others.get(owner);return o&&!o.dead&&o.pet||null}
function addPet(k){const n=pets.filter(p=>p.k===k).length+1;const p={id:Date.now()+Math.floor(Math.random()*1000),k,name:`${PETS[k].name} ${n}`,hp:PETS[k].hp,bag:{},down:0};
  pets.push(p);if(!curPet())summonPet(p.id);writeSave();if(!$('panel').hidden)renderPanel()}
function placePet(p,glow){Object.assign(p,{isPet:true,owner:ME,r:PETS[p.k].r,face:P.face,anim:Math.random()*9,cd:0,gcd:0,flash:0,glow:0,moving:false});
  let x=P.x-Math.cos(P.face)*28,y=P.y-Math.sin(P.face)*28;for(let k=0;k<20&&blocked(x,y,p.r);k++){x=P.x+rnd(-40,40);y=P.y+rnd(-40,40)}
  if(blocked(x,y,p.r)){x=P.x;y=P.y}p.x=x;p.y=y;
  if(glow){p.glow=1.4;burst(x,y-8,'#ffe08a',26);burst(x,y-8,'#fff6d0',12)}}
function summonPet(id){petOut=id;const p=curPet();if(p)placePet(p,true)}
function hurtPet(dmg,src){const p=curPet();if(!p)return;p.hp-=dmg;p.flash=.15;
  const a=Math.atan2(p.y-src.y,p.x-src.x);move(p,Math.cos(a)*12,Math.sin(a)*12);floats.push({x:p.x,y:p.y-22,txt:'-'+Math.round(dmg),t:.8,col:'#ffb0a0'});
  if(p.hp<=0)petDown(p)}
function petDown(p){p.hp=0;p.down=PET_DOWN;burst(p.x,p.y-6,'#6a4a3a',16);
  if(Object.keys(p.bag).length){act({t:'drop',x:p.x,y:p.y,bag:p.bag});p.bag={}}
  toast(`${p.name}倒下了，${PET_DOWN} 秒後回來`);writeSave()}
function petStep(p,tx,ty,spd,dt){const a=Math.atan2(ty-p.y,tx-p.x);p.face=a;p.moving=true;move(p,Math.cos(a)*spd*dt,Math.sin(a)*spd*dt)}
function updatePet(dt){
  for(const p of pets)if(p.down>0){p.down-=dt;if(p.down<=0){p.down=0;p.hp=PETS[p.k].hp;if(p.id===petOut){placePet(p,true);toast(`${p.name}回來了`)}}}
  const p=curPet();if(!p)return;const D=PETS[p.k];
  p.anim+=dt;p.cd-=dt;p.gcd-=dt;p.flash-=dt;p.glow-=dt;p.moving=false;
  if(P.dead)return;
  const od=dist(p,P);if(od>500){placePet(p,false);return}
  // fight: hostile mobs near the owner (wild boars only once they're angry, so taming isn't interrupted)
  let tgt=null,bd=1e9;for(const m of mobs){if(m.k==='boar'&&m.aggro<=0)continue;const dm=dist(m,P);if(dm<220){const d=dist(m,p);if(d<bd){bd=d;tgt=m}}}
  if(tgt){const reach=p.r+tgt.r+4;if(bd>reach)petStep(p,tgt.x,tgt.y,D.spd*1.1,dt);else p.face=Math.atan2(tgt.y-p.y,tgt.x-p.x);
    if(bd<=reach+4&&p.cd<=0){p.cd=D.cd;floats.push({x:tgt.x,y:tgt.y-tgt.r-8,txt:String(D.dmg),t:.7,col:'#d8f0b0'});burst(tgt.x,tgt.y,tgt.k==='moss'?'#9fc069':'#b84a3a',4);
      act({t:'hit',id:tgt.id,dmg:D.dmg,x:p.x,y:p.y,pet:1})}
    return}
  // gather: loose pickables near the owner
  if(D.gather&&p.gcd<=0){let g=null,gd=1e9;forCells(P.x,P.y,4,o=>{const R=RES[o.k];if(!R.pick||o.k==='bush'&&o.dep>0)return;if(dist(o,P)>160)return;const d=dist(o,p);if(d<gd){gd=d;g=o}});
    if(g){if(gd>16)petStep(p,g.x,g.y,D.spd,dt);else{p.gcd=1.2;act({t:'res',c:g.cell,dmg:0,pet:1})}return}}
  // follow
  if(od>56)petStep(p,P.x,P.y,od>200?D.spd*1.4:D.spd,dt)}

/* ---------- network ---------- */
function net(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function sendTo(id,o){o.to=id;net(o)}
function evt(o){applyEvt(o);if(MODE==='host')net(o)}          // world change: apply here, mirror to clients
function act(o){if(MODE==='client')net(o);else handleAct(o,ME)} // player intent: host/solo decide
function giveTo(from,k,n,x,y,toPet){if(n<=0)return;if(from===ME)give(k,n,x,y,toPet);else sendTo(from,{t:'give',k,n,x,y,p:toPet?1:0})}
function toPlayer(from,o){if(from===ME)onPrivate(o);else sendTo(from,o)}
function toAll(o){onPrivate(o);for(const id of others.keys())sendTo(id,Object.assign({},o))}
// messages meant for one player only (taming progress, new pets)
function onPrivate(m){switch(m.t){
  case'love':floats.push({x:m.x,y:m.y-24,txt:`♥ ${m.n}/${TAME_N}`,t:1.2,col:'#ff9fb8'});break;
  case'tame':addPet('boar');banner('馴服了野豬','打開背包的「寵物」分頁可以召喚或收回');break;

}}
function giveAll(k,n,x,y){giveTo(ME,k,n,x,y);for(const id of others.keys())giveTo(id,k,n,x,y)}
function refund(from,cost,msg){if(from===ME){for(const k in cost)inv[k]=(inv[k]||0)+cost[k];toast(msg)}else sendTo(from,{t:'refund',cost,msg})}
function handleAct(m,from){switch(m.t){
  case'hit':{const mob=mobs.find(o=>o.id===m.id);if(mob)hitMob(mob,m.dmg,from,m.x,m.y,m.pet);break}

    b.love=(b.love||0)+1;b.wt=2;b.wx=b.wy=0;
    if(b.love>=TAME_N){mobs.splice(mobs.indexOf(b),1);evt({t:'tm',id:b.id,x:b.x,y:b.y});toPlayer(from,{t:'tame'})}
    else toPlayer(from,{t:'love',n:b.love,x:b.x,y:b.y});break}
  case'drop':evt({t:'ld',id:++lootSeq,x:m.x,y:m.y,bag:m.bag});break;
  case'fput':{const s=structGrid[m.c],n=Math.floor(m.n);if(!s||s.k!=='furnace'||!(n>0)||m.k!=='煤炭'&&!SMELT[m.k]){if(n>0)refund(from,{[m.k]:n},'熔爐不見了，材料退回');break}
    const f=s.fz;if(m.k==='煤炭')f.fuel+=n;else f.q[m.k]=(f.q[m.k]||0)+n;evt({t:'fz',c:m.c,f});break}
  case'fout':{const s=structGrid[m.c];if(!s||s.k!=='furnace')break;const f=s.fz;for(const k in f.out)giveTo(from,k,f.out[k],s.x,s.y-20);f.out={};evt({t:'fz',c:m.c,f});break}
  case'pick':{const l=loots.find(o=>o.id===m.id);if(!l)break;evt({t:'lr',id:l.id});for(const k in l.bag)giveTo(from,k,l.bag[k],l.x,l.y);break}
  case'build':{if(isWallK(m.k)){const g=snapWall(m.o==='v'?'v':'h',m.x,m.y);if(g.c<0||biome[g.c]===0||(g.o==='v'?wallV:wallH)[g.c])refund(from,m.cost,'那個位置被別人佔走了，材料退回');else evt({t:'sa',k:m.k,x:g.x,y:g.y,o:g.o});break}

  case'demo':{const s=isWallK(m.k)?(m.o==='v'?wallV:wallH)[snapWall(m.o==='v'?'v':'h',m.x,m.y).c]:structGrid[ci(m.x,m.y)];if(!s||s.k!==m.k)break;
    evt({t:'sr',k:s.k,x:s.x,y:s.y,o:s.o});const back={},add=(k,n)=>{if(n>0)back[k]=(back[k]||0)+n},r=RECIPES.find(r=>r.id===s.k);
    if(r)for(const k in r.cost)add(k,r.cost[k]);if(s.fz){for(const k in s.fz.q)add(k,s.fz.q[k]);add('煤炭',s.fz.fuel);for(const k in s.fz.out)add(k,s.fz.out[k])}
    let dy=0;for(const k in back){giveTo(from,k,back[k],s.x,s.y-dy);dy+=14}break}
  case'sleep':if(!isNight())break;dayT=.02;day++;evt({t:'bn',h:`第 ${day} 天`,s:MODE==='solo'?'一夜好眠，獲得「休息」':`${m.n} 睡了一覺，天亮了`});
    for(let i=mobs.length-1;i>=0;i--)if(mobs[i].k==='moss'&&Math.hypot(mobs[i].x-m.x,mobs[i].y-m.y)<700)mobs.splice(i,1);break;
  case'summon':{if(boss||flags.boss){refund(from,{獠牙:3,樹脂:5},'狼王已經醒了');break}
    flags.summoned=true;const sp=findSpot(altar.x,altar.y,140,200,[1,2,3])||{x:altar.x,y:altar.y-160};boss=spawnMob('boss',sp.x,sp.y);evt({t:'bn',h:'灰鬃狼王',s:'牠會衝刺撲擊，看到牠發紅光就翻滾閃開'});break}
}}
function applyEvt(m){switch(m.t){
  case'rh':{const o=resGrid[m.c];if(!o)break;o.hp=m.hp;o.flash=.15;burst(o.x,o.y-8,RES[o.k].mine?'#9a9d98':'#c9a26a',5);break}
  case'rx':{const o=resGrid[m.c];if(!o)break;const d=RES[o.k];resGrid[m.c]=null;if(d.pick)burst(o.x,o.y,ITEM[d.drop[0][0]],6);else burst(o.x,o.y-10,d.mine?'#8d918c':'#5d7f3a',16);break}

  case'tm':burst(m.x,m.y-8,'#ff9fb8',22);floats.push({x:m.x,y:m.y-30,txt:'♥',t:1.4,col:'#ff9fb8'});if(MODE==='client')mobs=mobs.filter(o=>o.id!==m.id);break;

  case'sr':{const grid=isWallK(m.k)?(m.o==='v'?wallV:wallH):structGrid,c=isWallK(m.k)?snapWall(m.o==='v'?'v':'h',m.x,m.y).c:ci(m.x,m.y),s=grid[c];if(!s||s.k!==m.k)break;
    grid[c]=null;structs.splice(structs.indexOf(s),1);burst(s.x,s.y-10,m.k==='wall'||m.k==='bench'||m.k==='bed'?'#a0703f':'#9a9d98',14);break}
  case'fz':{const s=structGrid[m.c];if(s&&s.k==='furnace')s.fz=normFz(m.f);break}
  case'lr':{const l=loots.find(o=>o.id===m.id);if(l){loots.splice(loots.indexOf(l),1);burst(l.x,l.y,'#a0703f',8)}break}
}}
function sendWorld(id){const RK=Object.keys(RES),res=[];for(const o of resGrid)if(o)res.push([o.cell,RK.indexOf(o.k),o.x,o.y,o.hp,Math.max(0,o.dep)]);
  sendTo(id,{t:'world',seed,day,dt:dayT,fs:flags.summoned,fb:flags.boss,structs:structs.map(s=>s.fz?[s.k,s.x,s.y,0,s.fz]:s.o?[s.k,s.x,s.y,s.o]:[s.k,s.x,s.y]),res,loots:loots.map(l=>[l.id,l.x,l.y,l.bag])})}
function sendSnap(){net({t:'snap',day,dt:dayT,fs:flags.summoned,fb:flags.boss,b:boss?boss.id:0,
  m:mobs.map(m=>[m.id,m.k,Math.round(m.x),Math.round(m.y),Math.round(m.face*100)/100,Math.max(0,Math.round(m.hp)),m.max,m.flash>0?1:0,m.state,m.aggro>0?1:0])})}
function applySnap(s){day=s.day;dayT=s.dt;flags.summoned=s.fs;flags.boss=s.fb;const seen=new Set();
  for(const[id,k,x,y,f,hp,max,fl,st,ag]of s.m){seen.add(id);let m=mobs.find(o=>o.id===id);
    if(!m){m=makeMob(k,x,y);m.id=id;mobs.push(m)}
    m.tx=x;m.ty=y;m.face=f;m.hp=hp;m.max=max;if(fl)m.flash=.15;m.state=st;m.aggro=ag}
  mobs=mobs.filter(m=>seen.has(m.id));boss=mobs.find(m=>m.id===s.b)||null}
function sendState(){net({t:'st',all:1,n:myName,x:Math.round(P.x),y:Math.round(P.y),f:Math.round(P.face*100)/100,w:P.weapon,s:P.swing>0?Math.round(P.swing*100)/100:0,r:P.roll>0?1:0,h:P.hurt>0?1:0,a:has('皮甲')?1:0,d:P.dead?1:0,...petState()})}
function petState(){const p=curPet();return p?{pk:p.k,px:Math.round(p.x),py:Math.round(p.y),pf:Math.round(p.face*100)/100,ph:Math.ceil(p.hp),pg:p.glow>0?1:0,pw:p.moving?1:0}:{}}
function updateOther(m){let o=others.get(m.from);if(!o){o={id:m.from,x:m.x,y:m.y,r:12,walk:0,inv:0,swing:0};others.set(m.from,o)}
  o.n=String(m.n||'').slice(0,10);o.tx=m.x;o.ty=m.y;o.face=m.f;o.weapon=WEAPONS[m.w]?m.w:'none';if(m.s)o.swing=m.s;o.roll=m.r?.1:0;o.hurt=m.h?.1:0;o.armor=!!m.a;o.dead=!!m.d;
  if(PETS[m.pk]){if(!o.pet||o.pet.k!==m.pk)o.pet={isPet:true,owner:m.from,k:m.pk,x:m.px,y:m.py,r:PETS[m.pk].r,anim:0,flash:0,glow:0};
    Object.assign(o.pet,{tx:m.px,ty:m.py,face:m.pf,hp:m.ph,moving:!!m.pw});if(m.pg)o.pet.glow=Math.max(o.pet.glow,.3)}
  else o.pet=null}
function tickOthers(dt){for(const o of others.values()){const dx=o.tx-o.x,dy=o.ty-o.y,l=Math.hypot(dx,dy),k=Math.min(1,dt*15);
  if(l>300){o.x=o.tx;o.y=o.ty}else{o.x+=dx*k;o.y+=dy*k}if(l>1)o.walk+=dt*9;o.swing-=dt;
  const p=o.pet;if(p){if(Math.hypot(p.tx-p.x,p.ty-p.y)>300){p.x=p.tx;p.y=p.ty}else{p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}p.anim+=dt;p.flash-=dt;p.glow-=dt}}}
function tickClient(dt){time+=dt;dayT=Math.min(.9999,dayT+dt/DAY_LEN);
  for(const s of structs)if(s.fz&&s.fz.burn>0){s.fz.burn=Math.max(0,s.fz.burn-dt);if(Object.keys(s.fz.q).length)s.fz.prog=Math.min(SMELT_T,s.fz.prog+dt)}
  for(const m of mobs){m.anim+=dt;m.flash-=dt;const k=Math.min(1,dt*12);m.x+=(m.tx-m.x)*k;m.y+=(m.ty-m.y)*k}
  for(const s of structs)s.anim+=dt}
let netT=0,snapT=0,bushT=0;
function netTick(dt){
  netT-=dt;if(netT<=0&&started){netT=1/15;sendState()}
  if(MODE==='host'){snapT-=dt;if(snapT<=0){snapT=.1;sendSnap()}}
  bushT-=dt;if(bushT<=0){bushT=1;for(const o of resGrid)if(o&&o.dep>0)o.dep-=1}}
function netMsg(t){$('netTxt').textContent=t;$('netbox').hidden=!t}
function onNet(m){
  switch(m.t){
  case'hello':myId=m.id;netInfo=m;if(m.role==='host'){MODE='host';bootHost()}else{MODE='client';if(!m.hostReady)netMsg('等待主機開啟世界…（主機那台電腦要先執行「開主機.bat」）')}return;
  case'host':if(MODE==='client'){writeSave();location.reload()}return;
  case'nohost':writeSave();netMsg('主機離線了。主機回來後會自動重新連上。');return;
  case'leave':others.delete(m.id);return;
  case'peer':if(MODE==='host'&&ready)sendWorld(m.id);return;
  case'world':if(MODE==='client'&&!ready){netMsg('');bootClient(m)}return;
  }
  if(!ready)return;
  if(m.t==='st'){updateOther(m);return}
  if(MODE==='host'){handleAct(m,m.from);return}
  switch(m.t){
  case'snap':applySnap(m);break;
  case'give':if(started)give(m.k,m.n,m.x,m.y,m.p);break;
  case'refund':for(const k in m.cost)inv[k]=(inv[k]||0)+m.cost[k];toast(m.msg);break;
  case'hurt':if(started)hitPlayer(m.dmg,m);break;
  case'phurt':if(started)hurtPet(m.dmg,m);break;
  case'love':case'tame':case'pup':if(started)onPrivate(m);break;
  default:applyEvt(m)}}
function connect(){
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){bootSolo();return}
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}onNet(m)};
  ws.onclose=()=>{if(MODE==='pending'){bootSolo();return}writeSave();netMsg('跟主機的連線斷了，重新連線中…');retry()}}

function render(){

  const hw=VW/2/SCALE,hh=VH/2/SCALE;
  const i0=Math.max(0,Math.floor((cx-hw)/CELL)-1),i1=Math.min(COLS-1,Math.floor((cx+hw)/CELL)+1),j0=Math.max(0,Math.floor((cy-hh)/CELL)-1),j1=Math.min(ROWS-1,Math.floor((cy+hh)/CELL)+2);
  // ground
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const c=j*COLS+i;ctx.fillStyle=cellCol[c];ctx.fillRect(i*CELL,j*CELL,CELL+1,CELL+1)}
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const c=j*COLS+i,b=biome[c],h=hash(i,j,seed+11),x=i*CELL,y=j*CELL;

    ctx.strokeStyle='#3a4d26';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x-10,m.y-8-b);ctx.lineTo(m.x-15,m.y-2-b);ctx.moveTo(m.x+10,m.y-8-b);ctx.lineTo(m.x+15,m.y-2-b);ctx.stroke()}
  else{shadow(m.x,m.y+10,34,11);const wind=m.state==='wind';ctx.save();ctx.translate(m.x,m.y-14);ctx.rotate(a);
    if(wind){ctx.fillStyle=`rgba(255,80,60,${.35+Math.sin(time*30)*.2})`;ctx.beginPath();ctx.ellipse(6,0,46,26,0,0,6.28);ctx.fill()}
    ctx.fillStyle=f?'#fff':'#7d858b';for(const[lx,ly]of[[-18,-15],[-18,15],[14,-15],[14,15]]){ctx.beginPath();ctx.ellipse(lx+Math.sin(m.anim*10+lx)*3,ly,6,4,0,0,6.28);ctx.fill()}
    ctx.fillStyle=f?'#fff':'#8f969c';ctx.beginPath();ctx.ellipse(-4,0,30,17,0,0,6.28);ctx.fill();
    ctx.fillStyle=f?'#fff':'#5c636a';ctx.beginPath();ctx.ellipse(8,0,16,19,0,0,6.28);ctx.fill();
    ctx.strokeStyle='#8f969c';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-32,0);ctx.quadraticCurveTo(-46,Math.sin(m.anim*6)*10,-52,Math.sin(m.anim*6)*14);ctx.stroke();
    ctx.fillStyle=f?'#fff':'#a2a9ae';ctx.beginPath();ctx.ellipse(28,0,13,10,0,0,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(36,-5);ctx.lineTo(48,0);ctx.lineTo(36,5);ctx.fill();
    ctx.fillStyle='#5c636a';ctx.beginPath();ctx.moveTo(22,-8);ctx.lineTo(18,-16);ctx.lineTo(28,-9);ctx.moveTo(22,8);ctx.lineTo(18,16);ctx.lineTo(28,9);ctx.fill();
    ctx.fillStyle=wind?'#ff5a3a':'#bfe8ff';ctx.fillRect(32,-5,3,3);ctx.fillRect(32,2,3,3);ctx.restore()}
  if(m.hp<m.max&&m.k!=='boss'){const w=m.r*2;ctx.fillStyle='#000a';ctx.fillRect(m.x-w/2,m.y-m.r*2-12,w,3);ctx.fillStyle='#d55a4a';ctx.fillRect(m.x-w/2,m.y-m.r*2-12,w*m.hp/m.max,3)}}
const CAPES=['#7a3b33','#2f5d7a','#4f6b2a','#8a6a2a','#5f3a7a','#2a6b62'];
// pets reuse the boar / Wolf King art (pup = shrunken wolf), plus a heart in the owner's cape colour and a green hp bar
function drawPet(p){const D=PETS[p.k],wolf=p.k==='wolf';
  if(p.glow>0){const g=ctx.createRadialGradient(p.x,p.y-8,0,p.x,p.y-8,46);g.addColorStop(0,`rgba(255,230,140,${Math.min(1,p.glow)*.75})`);g.addColorStop(1,'rgba(255,220,120,0)');ctx.fillStyle=g;ctx.fillRect(p.x-46,p.y-54,92,92)}
  const m={x:p.x,y:p.y,face:p.face,anim:p.anim,flash:p.flash,aggro:p.moving?1:0,hp:1,max:1,r:p.r,k:wolf?'boss':'boar',state:'chase'};
  if(wolf){ctx.save();ctx.translate(p.x,p.y);ctx.scale(.42,.42);ctx.translate(-p.x,-p.y);drawMob(m);ctx.restore()}else drawMob(m);
  const top=p.y-(wolf?24:30),w=24;
  ctx.fillStyle='#000a';ctx.fillRect(p.x-w/2,top,w,3);ctx.fillStyle='#7fb069';ctx.fillRect(p.x-w/2,top,w*Math.max(0,p.hp)/D.hp,3);
  ctx.textAlign='center';ctx.font='700 11px system-ui,sans-serif';ctx.fillStyle='#000a';ctx.fillText('♥',p.x+1,top-3);ctx.fillStyle=CAPES[(p.owner===ME?myId:p.owner)%CAPES.length];ctx.fillText('♥',p.x,top-4)}
function drawLoot(l){shadow(l.x+1,l.y+3,9,4);ctx.fillStyle='#8a6236';ctx.beginPath();ctx.ellipse(l.x,l.y-4,8,7,0,0,6.28);ctx.fill();
  ctx.fillStyle='#5a3d22';ctx.fillRect(l.x-4,l.y-12,8,3);ctx.fillStyle='#e0a646';ctx.fillRect(l.x-1,l.y-6,2,2)}
function drawPlayer(pl){const x=pl.x,y=pl.y,a=pl.face,c=Math.cos(a),s=Math.sin(a);
  if(pl.inv>0&&pl.roll<=0&&Math.floor(time*20)%2)ctx.globalAlpha=.55;
  shadow(x,y+5,12,5);
  const bob=pl.roll>0?0:Math.sin(pl.walk)*1.5;
  if(pl.roll>0){ctx.fillStyle='#365a7a';ctx.beginPath();ctx.ellipse(x,y-6,13,9,a,0,6.28);ctx.fill();ctx.globalAlpha=1;return}
  // cape (colour per player id; solo keeps the original red)
  ctx.fillStyle=CAPES[(pl===P?myId:pl.id)%CAPES.length];ctx.beginPath();ctx.ellipse(x-c*5,y-8-s*5+bob,11,9,a,0,6.28);ctx.fill();
  // body
  ctx.fillStyle=pl.hurt>0?'#fff':(pl===P?has('皮甲'):pl.armor)?'#7a5236':'#3f6688';ctx.beginPath();ctx.arc(x,y-10+bob,10,0,6.28);ctx.fill();
  ctx.fillStyle='#3a2a1c';ctx.fillRect(x-10,y-9+bob,20,2.5);
  // weapon
  const w=WEAPONS[pl.weapon],sw=pl.swing>0?(pl.swing/.24-.5)*w.arc*2.2:-.9;const wa=a+sw;
  const hx=x+Math.cos(wa)*9,hy=y-10+bob+Math.sin(wa)*9;
  if(w.len){ctx.strokeStyle='#6b4a2b';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+Math.cos(wa)*w.len,hy+Math.sin(wa)*w.len);ctx.stroke();
    const tx=hx+Math.cos(wa)*w.len,ty=hy+Math.sin(wa)*w.len;ctx.fillStyle=ITEM[pl.weapon];
    if(pl.weapon==='燧石矛'){ctx.beginPath();ctx.moveTo(tx+Math.cos(wa)*9,ty+Math.sin(wa)*9);ctx.lineTo(tx-Math.sin(wa)*4,ty+Math.cos(wa)*4);ctx.lineTo(tx+Math.sin(wa)*4,ty-Math.cos(wa)*4);ctx.fill()}
    else if(pl.weapon==='狼牙劍'){ctx.strokeStyle='#d7e9f3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hx+Math.cos(wa)*6,hy+Math.sin(wa)*6);ctx.lineTo(tx+Math.cos(wa)*6,ty+Math.sin(wa)*6);ctx.stroke()}
    else if(pl.weapon!=='木棒'){ctx.save();ctx.translate(tx,ty);ctx.rotate(wa);ctx.fillRect(-3,pl.weapon==='燧石鎬'?-8:-2,6,pl.weapon==='燧石鎬'?16:9);ctx.restore()}
    else{ctx.lineWidth=5;ctx.strokeStyle='#7b5634';ctx.beginPath();ctx.moveTo(hx+Math.cos(wa)*12,hy+Math.sin(wa)*12);ctx.lineTo(tx,ty);ctx.stroke()}}
  else{ctx.fillStyle='#e0b48e';ctx.beginPath();ctx.arc(hx+Math.cos(wa)*4,hy+Math.sin(wa)*4,3.5,0,6.28);ctx.fill()}
  if(pl.swing>0){const al=Math.min(1,pl.swing/.24);ctx.fillStyle=`rgba(255,240,200,${.14*al})`;ctx.beginPath();ctx.moveTo(x,y-10);ctx.arc(x,y-10,w.range,a-w.arc,a+w.arc);ctx.closePath();ctx.fill();
    ctx.strokeStyle=`rgba(255,240,200,${.45*al})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-10,w.range-4,a-w.arc,a+w.arc);ctx.stroke()}
  // head
  ctx.fillStyle='#e0b48e';ctx.beginPath();ctx.arc(x+c*2,y-14+bob+s*2,6.5,0,6.28);ctx.fill();
  ctx.fillStyle='#c98b3a';ctx.beginPath();ctx.arc(x-c*1.5,y-15+bob-s*1.5,6.5,a+1.9,a-1.9);ctx.fill();
  ctx.fillStyle='#b77a30';ctx.beginPath();ctx.arc(x+c*6,y-12+bob+s*6,3,0,6.28);ctx.fill();
  ctx.globalAlpha=1}

/* ---------- HUD ---------- */
function hud(){const MH=maxHp(),MS=maxSt();
  $('hpFill').style.width=(P.hp/MH*100)+'%';$('hpTxt').textContent=`${Math.ceil(P.hp)} / ${Math.round(MH)}`;$('stFill').style.width=(P.st/MS*100)+'%';
  let fh='';for(let i=0;i<3;i++){const f=foods[i];if(f){const d=FOODS[f.k],p=f.t/d.t,C=2*Math.PI*17;fh+=`<div class="food" style="color:${d.col};border-color:${d.col}66" title="${f.k}"><svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="17" fill="none" stroke="${d.col}" stroke-width="2.5" stroke-dasharray="${C*p} ${C}"/></svg><span style="color:var(--ink)">${f.k[0]}</span></div>`}else fh+='<div class="food empty"></div>'}
  $('foods').innerHTML=fh;
  $('buffs').textContent=P.rest>0?`休息 ${Math.ceil(P.rest)}s`:'';
  const po=pets.find(p=>p.id===petOut);
  $('petHud').textContent=!po?'':po.down>0?`${po.name} 倒下了・${Math.ceil(po.down)} 秒後回來`:`${po.name}  ${Math.ceil(po.hp)}/${PETS[po.k].hp}`+(Object.keys(po.bag).length?`・攜帶 ${Object.values(po.bag).reduce((a,b)=>a+b,0)} 件`:'');
  $('petHud').classList.toggle('down',!!po&&po.down>0);
  const tod=dayT<.58?'白天':dayT<.68?'黃昏':'夜晚';$('clock').textContent=`第 ${day} 天・${tod}`;
  const gi=goalIdx();$('goal').innerHTML=gi<GOALS.length?`<b>目標</b>${GOALS[gi][0]}`:'<b>完成</b>這片草原是你的了';
  syncHeld();renderHot();const hk=held();
  $('weaponTag').innerHTML=`手持 <b>${WEAPONS[hk]?WEAPONS[hk].name:hk||'空手'}</b>${FOODS[hk]?(TOUCH?'・按攻擊吃':'・左鍵吃'):''}${has('皮甲')?'・穿著皮甲':''}${TOUCH?'':'　<kbd>1</kbd>~<kbd>8</kbd>／滾輪／<kbd>Q</kbd> 切換'}`;
  $('bossBar').hidden=!boss;if(boss)$('bossFill').style.width=(boss.hp/boss.max*100)+'%';
  if(MODE==='solo'||started)reveal(P.x,P.y);
  drawMap($('mini'),P.x,P.y,MINI_SPAN,false);if(!$('bigmap').hidden)drawMap($('bigCv'),W/2,H/2,W,true)}

/* ---------- maps ---------- */
// minimap = MINI_SPAN world units around you (top-left); big map = whole world (M key or click the minimap)
const MINI_SPAN=1200,MAPCOL={fire:'#ff8a3a',bench:'#c9a26a',bed:'#c95b5b',wall:'#3d2a17',swall:'#b8bcb6',furnace:'#d0603a'};
function drawMap(cvs,cx,cy,span,big){const g=cvs.getContext('2d'),S=cvs.width,k=S/span,u=big?S/260:S/140;
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#0b1a22';g.fillRect(0,0,S,S);
  g.imageSmoothingEnabled=false;g.setTransform(k,0,0,k,S/2-cx*k,S/2-cy*k);g.drawImage(mapImg,0,0,W,H);
  g.imageSmoothingEnabled=true;g.drawImage(fogImg,0,0,W,H);g.setTransform(1,0,0,1,0,0); // smoothing softens the fog edge
  const at=(x,y)=>[S/2+(x-cx)*k,S/2+(y-cy)*k];
  for(const s of structs){if(!seen[s.cell])continue;const[x,y]=at(s.x,s.y);g.fillStyle=MAPCOL[s.k];
    if(s.o){const L=CELL/2*k,t=.8*u;if(s.o==='v')g.fillRect(x-t,y-L,t*2,L*2);else g.fillRect(x-L,y-t,L*2,t*2)}else{const r=2.6*u;g.fillRect(x-r,y-r,r*2,r*2)}}
  if(seen[altar.cell]){const[x,y]=at(altar.x,altar.y);g.save();g.translate(x,y);g.rotate(Math.PI/4);g.fillStyle=flags.boss?'#6d7873':'#e0a646';g.strokeStyle='#000';g.lineWidth=u;g.fillRect(-3.5*u,-3.5*u,7*u,7*u);g.strokeRect(-3.5*u,-3.5*u,7*u,7*u);g.restore()}
  for(const o of others.values())if(!o.dead){const[x,y]=at(o.x,o.y);g.fillStyle=CAPES[o.id%CAPES.length];g.strokeStyle='#fff';g.lineWidth=u;g.beginPath();g.arc(x,y,3.2*u,0,6.28);g.fill();g.stroke()}
  {const[x,y]=at(P.x,P.y);g.save();g.translate(x,y);g.rotate(P.face);g.fillStyle='#ffe08a';g.strokeStyle='#000';g.lineWidth=u;g.beginPath();g.moveTo(6*u,0);g.lineTo(-4*u,-4*u);g.lineTo(-2*u,0);g.lineTo(-4*u,4*u);g.closePath();g.fill();g.stroke();g.restore()}}
function toggleMap(on){const m=$('bigmap');on=on===undefined?m.hidden:on;if(on&&(!$('intro').hidden||!$('dead').hidden))return;
  if(on)$('panel').hidden=true;m.hidden=!on;paused=on||!$('panel').hidden||!$('dead').hidden||!$('intro').hidden;
  if(on){atkHeld=false;drawMap($('bigCv'),W/2,H/2,W,true)}}
$('mini').addEventListener('click',()=>toggleMap(true));
$('mapX').addEventListener('click',()=>toggleMap(false));
$('bigmap').addEventListener('pointerdown',e=>{if(e.target.id==='bigmap')toggleMap(false)});

/* ---------- loop ---------- */
let last=performance.now();
// solo pauses everything; in multiplayer the world keeps going while your panel is open or you're down
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(ready){if(!paused)updateLocal(dt);
    if(MODE==='solo'){if(!paused){updateWorld(dt);updatePet(dt);updateFx(dt)}else if(panelTab==='furnace'&&!$('panel').hidden)tickFurnaces(dt)}
    else{if(MODE==='host')updateWorld(dt);else tickClient(dt);if(started)updatePet(dt);tickOthers(dt);updateFx(dt);netTick(dt)}
    render();hudT-=dt;if(hudT<=0){hudT=.1;hud();refreshFurnacePanel()}}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- intro ---------- */
function setupIntro(){
  cam.x=P.x;cam.y=P.y;
  $('introCtl').innerHTML=TOUCH?'左半邊拖曳移動（推到底衝刺）・右下按鈕攻擊、翻滾、互動・右上開背包製作':'WASD 移動・Shift 衝刺・左鍵攻擊・右鍵／空白翻滾・E 互動・1～8／滾輪／Q 快捷欄・Tab 背包・M 地圖';
  if(MODE==='solo')$('introBtns').innerHTML=save?`<button class="act go" id="go" type="button">繼續（第 ${day} 天）</button><button class="act" id="fresh" type="button">新世界</button>`:`<button class="act go" id="go" type="button">開始</button>`;
  else{const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    $('introBtns').innerHTML=`<input class="namein" id="nameIn" maxlength="10" placeholder="你的名字" aria-label="你的名字" value="${esc(myName)}">`+
      (MODE==='host'?(save?`<button class="act go" id="go" type="button">繼續（第 ${day} 天）</button><button class="act" id="fresh" type="button">新世界</button>`:`<button class="act go" id="go" type="button">開始</button>`)
      :`<button class="act go" id="go" type="button">加入（第 ${day} 天）</button>`);
    const n=$('introNet');n.hidden=false;
    n.innerHTML=MODE==='host'?`你是主機。同事在瀏覽器網址列輸入：<br>${netInfo.ips.length?netInfo.ips.map(ip=>`<b>http://${ip}:${netInfo.port}</b>`).join('<br>'):'（找不到區網 IP，請確認這台電腦有接上公司網路）'}<br><small style="color:var(--mute)">這個分頁要一直開著，關掉世界就停了。</small>`:'已連上主機，你會跟大家在同一個世界。';
    $('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()})}
  $('go').addEventListener('click',()=>{let fresh=!save;
    if(MODE!=='solo'){myName=($('nameIn').value.trim()||myName).slice(0,10);try{localStorage.setItem('northland-name',myName)}catch(e){}
      const ps=loadKey(pkey());fresh=!ps;if(ps)applyPersonal(ps);cam.x=P.x;cam.y=P.y}
    started=true;$('intro').hidden=true;paused=false;if(fresh)banner(`第 ${day} 天`,'先砍幾棵樹吧')});
  if($('fresh'))$('fresh').addEventListener('click',e=>{const b=e.currentTarget;if(b.dataset.c)resetSave();else{b.dataset.c='1';b.textContent='確認刪除存檔？'}});
}
if(MODE==='solo')bootSolo();else{$('introBtns').innerHTML='<p class="sub">連線中…</p>';connect()}
if(TOUCH)$('touch').hidden=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden)writeSave()});
})();
</script>
