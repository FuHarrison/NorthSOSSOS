<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>北境求生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap">
<link rel="stylesheet" href="css/game.css">

<canvas id="game"></canvas>

<div class="hud" id="stats">
  <div class="bar"><i id="hpFill"></i><span id="hpTxt"></span></div>
  <div class="bar st"><i id="stFill"></i></div>
  <div id="foods"></div>
  <div id="buffs"></div>
  <div id="petHud"></div>
  <canvas id="mini" width="280" height="280" aria-label="小地圖（點一下或按 M 開大地圖）"></canvas>
</div>
<div class="hud" id="top"><div id="clock"></div><div id="goal"></div></div>
<div class="hud" id="topr"><button class="chip-btn" id="btnEmote" type="button">表情 <kbd>Z</kbd></button><button class="chip-btn" id="btnSet" type="button">設定 <kbd>Esc</kbd></button><button class="chip-btn" id="btnBuild" type="button">建造 <kbd>B</kbd></button><button class="chip-btn" id="btnPanel" type="button">背包・製作 <kbd>Tab</kbd></button></div>
<div class="hud" id="weaponTag"></div>
<div id="hotbar" aria-label="快捷欄"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="pauseNote" hidden>世界暫停中・主機按了暫停</div>
<div class="hud" id="bossBar" hidden><span id="bossName">灰鬃狼王</span><div class="bar"><i id="bossFill"></i></div></div>
<div class="hud" id="banner"></div>

<div id="touch" hidden>
  <div id="stick"><i></i></div>
  <div id="pad">
    <button class="tb" id="bAtk" type="button">攻擊</button>
    <button class="tb" id="bRoll" type="button">翻滾</button>
    <button class="tb" id="bUse" type="button">互動</button>
    <button class="tb" id="bSwap" type="button">切換</button>
    <button class="tb" id="bBlock" type="button">格擋</button>
  </div>
</div>

<div id="emoteMenu" hidden aria-label="表情動作"></div>

<div id="placeBar" hidden><span id="placeName"></span><span id="placeCost" class="costs"></span><small id="placeHint"></small><button id="placeRot" type="button" hidden>轉向</button><button id="placeOk" type="button">放置</button><button id="placeCancel" type="button">完成</button></div>

<div class="modal" id="panel" hidden>
  <div class="sheet" role="dialog" aria-label="背包與製作">
    <header>
      <h2 id="panelTitle">行囊</h2>
      <button class="tab on" data-tab="craft" type="button">製作</button>
      <button class="tab" data-tab="inv" type="button">背包</button>
      <button class="tab" data-tab="pets" type="button">寵物</button>
      <button class="tab" data-tab="skills" type="button">技能</button>
      <button class="tab" data-tab="help" type="button">說明</button>
      <button class="x" id="panelX" type="button" aria-label="關閉">×</button>
    </header>
    <div class="body" id="panelBody"></div>
  </div>
</div>

<div class="modal" id="intro">
  <div class="sheet">
    <div class="rune">ᚾ ᛟ ᚱ ᛞ</div>
    <h1>北境求生</h1>
    <p class="sub">你在一片陌生的草原醒來。砍樹、撿燧石、蓋營火、吃飽肚子熬過夜晚，然後在石祭壇喚醒灰鬃狼王。</p>
    <p id="introNet" hidden></p>
    <div class="row" id="introBtns"></div>
    <div class="ctl" id="introCtl"></div>
  </div>
</div>

<div class="modal" id="bigmap" hidden>
  <div class="sheet" role="dialog" aria-label="地圖">
    <header><h2>地圖</h2><div class="subtabs"><button type="button" class="subtab on" data-mm="pin">標記</button><button type="button" class="subtab" data-mm="ping">信號</button></div><button class="x" id="mapX" type="button" aria-label="關閉">×</button></header>
    <canvas id="bigCv" width="640" height="640"></canvas>
    <div id="pinEdit" hidden><input id="pinName" maxlength="12" aria-label="標記名稱"><button type="button" id="pinOk">確定</button><button type="button" id="pinDel">刪除</button></div>
    <div class="legend"><span><i style="background:#ffe08a"></i>你</span><span><i style="background:#5a8ab0"></i>其他玩家</span><span><i style="background:#e0a646;transform:rotate(45deg)"></i>石祭壇</span><span><i style="background:#ff8a3a"></i>營火</span><span><i style="background:#c9a26a"></i>工作台</span><span><i style="background:#c95b5b"></i>床</span><span><i style="background:#3d2a17"></i>木牆</span><span><i style="background:#b8bcb6"></i>石牆</span><span><i style="background:#d0603a"></i>熔爐</span><span><i style="background:#a87d4a"></i>箱子</span><span><i style="background:#0b1a22;outline:1px solid #ffffff40"></i>還沒去過</span><span><i style="background:#ffd23f"></i>標記</span><span><i style="background:#d8d4c8"></i>你的墓碑</span><span><kbd>M</kbd> 或 <kbd>Esc</kbd> 關閉</span><span id="mapHint"></span></div>
  </div>
</div>

<div class="modal" id="dead" hidden>
  <div class="sheet" style="padding:24px;gap:12px;max-width:360px;text-align:center">
    <h2 style="font-family:var(--display);font-size:28px;margin:0;letter-spacing:.1em">你倒下了</h2>
    <p class="note" style="margin:0" id="deadMsg"></p><p class="note" style="margin:0" id="deadNote"></p>
    <button class="act go" id="respawn" type="button">重新站起</button>
  </div>
</div>

<div class="modal" id="settings" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <header><h2>設定</h2><button class="x" id="setX" type="button" aria-label="關閉">×</button></header>
    <div class="body" id="setBody"></div>
  </div>
</div>

<div class="modal" id="netbox" hidden>
  <div class="sheet" style="padding:24px;max-width:380px;text-align:center"><p class="sub" id="netTxt" style="margin:0;line-height:1.6"></p></div>
</div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/save.js"></script>
<script src="js/player.js"></script>
<script src="js/panel.js"></script>
<script src="js/sim.js"></script>
<script src="js/net.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/sea.js"></script>
<script src="js/main.js"></script>

</body></html>
