<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>北境求生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: full-screen canvas world, HUD pinned to the four corners, modal panels in the center */
:root{
  --bg:#0e1411; --panel:#18201b; --panel2:#212b24; --line:#35433a;
  --ink:#ebe5d3; --mute:#9aa496; --accent:#e0a646; --accent2:#8fc0d8;
  --hp:#c94a3d; --st:#e2c14d; --good:#7fb069; --bad:#d06a5a;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--mute)}

.hud{position:fixed;pointer-events:none;z-index:5}
#stats{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);display:grid;gap:6px;width:min(220px,46vw)}
.bar{position:relative;height:14px;background:#000a;border:1px solid #ffffff22;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .15s}
#hpFill{background:linear-gradient(#e0624f,var(--hp))}
#stFill{background:linear-gradient(#f2d873,var(--st))}
.bar.st{height:8px}
.bar span{position:absolute;inset:0;font-size:10px;line-height:13px;padding-left:6px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
#foods{display:flex;gap:6px;margin-top:2px}
.food{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#000a;border:1px solid #ffffff1c;position:relative}
.food.empty{opacity:.35;border-style:dashed}
.food svg{position:absolute;inset:-2px;width:38px;height:38px;transform:rotate(-90deg)}
#buffs{font-size:11px;color:var(--accent2);text-shadow:0 1px 2px #000;min-height:14px}
#petHud{font-size:11px;color:var(--good);text-shadow:0 1px 2px #000}
#petHud.down{color:var(--bad)}

#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);text-align:center;width:min(520px,92vw)}
#clock{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.08em;text-shadow:0 1px 3px #000}
#goal{margin-top:4px;font-size:12px;color:var(--ink);background:#0009;border:1px solid #ffffff14;display:inline-block;padding:4px 10px;border-radius:999px;text-wrap:balance}
#goal b{color:var(--accent);font-weight:600;margin-right:6px}

#topr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 14px);pointer-events:auto;display:flex;gap:6px}
html.gray{filter:grayscale(1)}
.chip-btn{background:#0d130fcc;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip-btn:hover{border-color:var(--accent)}

#weaponTag{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px);font-size:12px;color:var(--mute);text-shadow:0 1px 2px #000}
#weaponTag b{color:var(--ink);font-weight:600}
#pauseNote{top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:#1b1407;background:var(--accent);border-radius:999px;padding:4px 14px;box-shadow:0 2px 10px #0008}
#toast{top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);font-size:13px;background:#000b;border-radius:6px;padding:6px 12px;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
#bossBar{bottom:calc(env(safe-area-inset-bottom,0px) + 130px);left:50%;transform:translateX(-50%);width:min(420px,80vw);text-align:center}
#bossBar span{font-family:var(--display);font-weight:900;letter-spacing:.2em;font-size:14px;text-shadow:0 1px 3px #000}
#bossBar .bar{height:10px;margin-top:4px}
#bossFill{background:linear-gradient(90deg,#6d7d8c,#c7d6e2)}
#mini{display:block;width:140px;height:140px;border-radius:8px;border:1px solid #ffffff2a;box-shadow:0 2px 8px #0008;pointer-events:auto;cursor:pointer;margin-top:2px}
#bigmap .sheet{width:min(640px,100%);max-height:none;padding:0}
#bigmap header{padding:10px 10px 8px 16px}
#bigCv{display:block;width:100%;aspect-ratio:1;background:#0b1a22;cursor:crosshair;touch-action:none}
#bigmap .sheet{position:relative}#bigmap header .subtabs{margin:0 0 8px}
#pinEdit{position:absolute;z-index:2;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 6px 18px #000a}
#pinEdit input{width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;color:var(--ink)}
#pinEdit button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 9px;font-size:12px}#pinEdit #pinOk{background:var(--accent);color:#1b1407;border-color:var(--accent);font-weight:700}
#mapHint{flex-basis:100%;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 12px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#banner{top:34%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,46px);letter-spacing:.12em;color:var(--accent);text-shadow:0 2px 14px #000,0 0 30px #e0a64655;opacity:0;transition:opacity .6s;text-align:center;white-space:nowrap}
#banner small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;color:var(--ink);margin-top:6px}
#banner.on{opacity:1}

/* touch controls */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #ffffff30;background:#00000026;display:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#ffffff40}
#pad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:190px;height:190px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid #ffffff38;background:#0d130fb3;color:var(--ink);font-size:13px;display:grid;place-items:center;touch-action:none}
.tb:active,.tb.down{background:#e0a64655;border-color:var(--accent)}
#bAtk{right:0;bottom:0;width:84px;height:84px;font-family:var(--display);font-weight:900;font-size:17px}
#bRoll{right:96px;bottom:0;width:58px;height:58px}
#bUse{right:0;bottom:96px;width:58px;height:58px}
#bSwap{right:78px;bottom:78px;width:50px;height:50px;font-size:12px}
#bBlock{right:150px;bottom:66px;width:50px;height:50px;font-size:12px}

#emoteMenu{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:grid;grid-template-columns:repeat(4,64px);gap:6px;background:#0d130fe6;border:1px solid var(--line);border-radius:12px;padding:8px}
#emoteMenu button{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 2px 4px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink)}
#emoteMenu button:hover{border-color:var(--accent)}#emoteMenu .em{font-size:22px;line-height:1}#emoteMenu kbd{position:absolute;left:3px;top:1px;border:0;padding:0;font-size:9px}
body.touch #emoteMenu{bottom:calc(env(safe-area-inset-bottom,0px) + 130px)}
#placeBar{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);display:flex;gap:8px;align-items:center;background:#0d130fe6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
#placeBar button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 14px}
#placeOk{background:var(--accent)!important;color:#1b1407;border-color:var(--accent)!important;font-weight:700}
#placeOk.demo{background:#c95b5b!important;border-color:#c95b5b!important;color:#fff}
#placeBar{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}#placeName,#placeBar button{white-space:nowrap}
#placeHint{color:var(--mute);font-size:11px;flex-basis:100%;order:9;text-align:center}body.touch #placeHint{display:none}
#hotbar.build{border-color:var(--accent)}.hs.no{opacity:.45}
body.touch #placeBar{bottom:calc(env(safe-area-inset-bottom,0px) + 220px)}
/* hotbar: one row at the bottom on desktop, a 4×2 grid above the weapon tag on touch (the right side is taken by the buttons) */
#hotbar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;padding:4px;background:#0d130fb3;border:1px solid #ffffff1f;border-radius:10px}
.hs{position:relative;width:46px;height:46px;border:1px solid #ffffff26;border-radius:7px;background:#00000059;display:grid;place-items:center;align-content:center;gap:2px;padding:0;color:var(--ink);touch-action:none}
.hs.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#e0a64626}
.hs kbd{position:absolute;left:3px;top:1px;border:0;padding:0;font-size:9px}
.hs .sw{width:16px;height:16px;border-radius:4px}.hs .ico{width:22px;height:22px}
.hs .hn{font-size:10px;line-height:1;white-space:nowrap;overflow:hidden;max-width:42px}
.dur{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:#0008;overflow:hidden}.dur i{display:block;height:100%}
.hs small{position:absolute;right:3px;top:1px;font-size:9px;color:var(--mute);font-variant-numeric:tabular-nums}
body.touch #hotbar{left:calc(env(safe-area-inset-left,0px) + 10px);transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);display:grid;grid-template-columns:repeat(4,38px)}
body.touch .hs{width:38px;height:38px}body.touch .hs kbd{display:none}

/* panels */
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#05080699;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{width:min(640px,100%);max-height:min(640px,calc(100vh - 32px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px #000a;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:4px;padding:10px 10px 0 16px;border-bottom:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:900;font-size:18px;margin:0 12px 8px 0;letter-spacing:.06em}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 10px 9px;color:var(--mute);font-size:14px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--mute);padding:4px 10px 10px}
.body{overflow-y:auto;padding:14px 16px 18px;min-height:0}
/* the bag/craft panel keeps one height on every tab; long tabs scroll inside it */
#panel .sheet{height:min(640px,calc(100vh - 32px))}#panelBody{flex:1}
.note{font-size:12px;color:var(--mute);margin:0 0 10px}
.subtabs{display:flex;gap:6px;margin:0 0 10px}
.subtab{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.subtab small{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.subtab.on{background:var(--accent);border-color:var(--accent);color:#1b1407;font-weight:700}
.craftpage{height:100%;display:flex;flex-direction:column;min-height:0}
.craftwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:10px}
.clist,.cinfo{border:1px solid var(--line);border-radius:10px;background:#0000001f;min-height:0}
.clist{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.ci{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:7px;background:none;padding:6px 8px;text-align:left;font-size:13px;color:var(--ink)}
.ci span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ci i{width:7px;height:7px;border-radius:50%;background:#ffffff22;flex:none}.ci i.ok{background:var(--good)}
.ci:hover{background:#ffffff0d}.ci.on{border-color:var(--accent);background:#e0a64622}
.cinfo{display:flex;flex-direction:column}
.cbody{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.cbody p{margin:0;font-size:12px;color:var(--mute);line-height:1.5}
.cbody h4{margin:6px 0 0;font-size:12px;color:var(--mute);font-weight:600}
.chead{display:flex;gap:10px;align-items:center}.chead .ico{width:44px;height:44px}
.chead h3{margin:0;font-size:17px}.chead em{font-style:normal;font-size:11px;color:var(--mute)}
.mats{display:grid;gap:4px}
.mat{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 8px;border-radius:6px;background:#00000033}
.mat .ico{width:20px;height:20px}.mat span{flex:1}.mat b{font-variant-numeric:tabular-nums}
.mat.ok b{color:var(--good)}.mat.no b{color:var(--bad)}
.cfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cfoot .act{margin:0;flex:1;min-width:110px;padding:8px}
.qty{display:flex;gap:4px;align-items:center}
.qty button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;min-width:32px;padding:6px 8px;font-size:13px;white-space:nowrap}
.qty input{width:52px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit;font-size:13px;color:var(--ink);text-align:center}
.cmax{font-size:12px;color:var(--mute)}.cwhy{flex-basis:100%;font-size:11px;color:var(--bad)}
@media (max-width:520px){.craftwrap{grid-template-columns:118px 1fr;gap:6px}.ci{padding:5px;gap:5px;font-size:12px}.ci .ico{width:20px;height:20px}.qty input{width:40px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.card h3 em{font-style:normal;font-size:11px;color:var(--mute);font-weight:400}
.card p{margin:0;font-size:12px;color:var(--mute);line-height:1.45}
.costs{display:flex;flex-wrap:wrap;gap:4px}
.cost{font-size:11px;padding:2px 6px;border-radius:4px;background:#00000040;font-variant-numeric:tabular-nums}
.cost.ok{color:var(--good)} .cost.no{color:var(--bad)}
.act{margin-top:auto;border:1px solid var(--line);background:#2c372f;border-radius:7px;padding:6px;font-size:13px}
.act.go{background:var(--accent);border-color:var(--accent);color:#1b1407;font-weight:700}
.act:disabled{opacity:.45;cursor:default}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}
.sw{width:22px;height:22px;border-radius:5px;flex:none;box-shadow:inset 0 -3px 0 #0004}
.ico{width:24px;height:24px;flex:none;display:block;filter:drop-shadow(0 1px 1px #0008)}
.card h3 .cn{display:flex;align-items:center;gap:6px;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:4px}
.stats span{font-size:11px;padding:2px 6px;border-radius:4px;background:#00000040;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600;margin-left:4px}
#bagMenu .stats{margin:0 4px 4px;max-width:220px}
.slot .n{flex:1;min-width:0;font-size:13px}
.slot .n small{display:block;color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.slot button{border:1px solid var(--line);background:#2c372f;border-radius:6px;padding:4px 8px;font-size:12px}
.slot button.on{background:var(--accent);color:#1b1407;border-color:var(--accent)}
.slot{flex-wrap:wrap}
.fbar{height:8px;border-radius:4px;background:#2c372f;overflow:hidden;margin:4px 0 8px}.fbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3a,#ffd27a)}
.fzh{margin:12px 0 6px;font-size:13px}
.inv.fz{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.bag{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bagwrap{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.bagsec,.hotsec{border:1px solid var(--line);border-radius:10px;padding:8px;background:#0000001f}
.bagsec{flex:1;min-height:0;overflow-y:auto}
.hotsec{flex:none;border-color:#e0a64655}
@media (max-width:520px){.bag,.phot{gap:4px}.bagsec,.hotsec{padding:6px}.bag .bs .hn,.phot .bs .hn{display:none}.bag .bs .ico,.phot .bs .ico{width:22px;height:22px}.bs em,.phot .bs kbd{font-size:8px}}
.bs{position:relative;aspect-ratio:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:grid;place-items:center;align-content:center;gap:3px;padding:2px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:var(--ink)}
.bs .sw{width:22px;height:22px;border-radius:5px}.bs .ico{width:28px;height:28px}
.bs .hn{font-size:11px;line-height:1.1;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bs small{position:absolute;right:4px;bottom:2px;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.bs em{position:absolute;left:4px;top:2px;font-style:normal;font-size:9px;color:var(--accent)}
.bs.held{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bs.over{border-color:#9fe07a;background:#9fe07a22}
.bs.empty{cursor:default;background:#00000033}
.photh b{font-weight:600;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}.photh b.full{color:var(--bad)}
.photh .act{margin:0 0 0 auto;padding:3px 10px;font-size:12px}
.eqsec{border-color:#8fc0d855}.eqsec .bs{cursor:pointer}.eqsec .bs.empty .hn{color:var(--mute)}
.skills{display:grid;gap:8px}.sk{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:grid;gap:4px}
.sk h3{margin:0;font-size:14px;display:flex;justify-content:space-between}.sk h3 b{color:var(--accent);font-variant-numeric:tabular-nums}.sk p{margin:0;font-size:12px;color:var(--mute)}
.sk .fbar i{background:linear-gradient(90deg,#8fc0d8,#c8e6f2)}
.upg{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;background:#0000001f}.upg p{margin:0}
.upg .act{margin:0;justify-self:start;padding:6px 14px}.ci .q{flex:none;font-size:11px;color:var(--accent)}
.chestwrap .bagsec{flex:1 1 0}.chestwrap .bs{cursor:pointer}
.benchlv{margin-left:auto;align-self:center;font-size:12px;color:var(--mute);white-space:nowrap}.benchlv b{color:var(--accent)}
#repairBtn{margin:0 0 0 8px;padding:5px 12px;font-size:12px;flex:none}
#chMsg{margin:0;min-height:16px;font-size:12px;color:var(--bad)}
.phot{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}

<script>
(()=>{
'use strict';
/* ---------- setup ---------- */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
const $=id=>document.getElementById(id);
// server.js runs this same script in Node as the multiplayer host (simulates the world, draws nothing): see startSim in server.js
const HEADLESS=!!globalThis.__NORTH_HEADLESS__;
const TOUCH=matchMedia('(pointer:coarse)').matches;
if(TOUCH)document.body.classList.add('touch');
let DPR=1,VW=0,VH=0,SCALE=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);dark.width=Math.ceil(VW/2);dark.height=Math.ceil(VH/2);SCALE=Math.max(.72,Math.min(1.25,Math.sqrt(VW*VH)/700));}
addEventListener('resize',resize);resize();

let DAY_LEN=360; // seconds in a day: CFG.dayMin
const SKEY='northland-save-v1',WKEY='northland-mp-world-v1';
function loadKey(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
// each world keeps the size it was made with: saves from before the bigger map have no mapW and stay OLD_MAP, new worlds get NEW_MAP.
// Everything is sized once at load, so a tab that finds out it has the wrong size (a client joining, a host starting over) remembers the right one and reloads
// 7200 worlds (MID_MAP) are one big continent; new worlds are 14400 with the same mainland in the middle and three outer continents around it
const OLD_MAP=3200,MID_MAP=7200,NEW_MAP=14400,MAPW_KEY='northland-mapw';
const mapWOf=s=>s?(s.mapW||OLD_MAP):NEW_MAP;
// over http, server.js writes the current world's size into the page as __NORTH_MAPW, so clients start with the right size instead of reloading once
const W=(()=>{const http=location.protocol.startsWith('http');let ov=null;try{ov=http&&sessionStorage.getItem(MAPW_KEY)}catch(e){}return http&&+globalThis.__NORTH_MAPW||+ov||mapWOf(loadKey(http?WKEY:SKEY))})(),H=W,CELL=40,COLS=W/CELL,ROWS=H/CELL;
function wrongMapSize(want){if(want===W)return false;try{sessionStorage.setItem(MAPW_KEY,want)}catch(e){return false}location.reload();return true}
let save=null,seed=0;

/* ---------- noise ---------- */
function hash(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,seed),b=hash(xi+1,yi,seed),c=hash(xi,yi+1,seed),d=hash(xi+1,yi+1,seed);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);n+=a;f*=2;a*=.5}return s/n}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- data ---------- */
const ITEM={木頭:'#a0703f',石頭:'#8d918c',燧石:'#45586b',樹脂:'#d89a2c',皮革:'#9b6a46',生肉:'#c95b5b',烤肉:'#8a4a2b',莓果:'#b8324a',蘑菇:'#d98a3d',獠牙:'#e8e0c8',狼王之牙:'#cfe3ef',木棒:'#7b5634',燧石斧:'#56697c',燧石鎬:'#5c6670',燧石矛:'#6b7f92',皮甲:'#8a5b3a',狼牙劍:'#b9d4e4',煤炭:'#2e2c2b',銅礦:'#b5703a',錫礦:'#a9b4b8',鐵礦:'#8a5a4a',銅錠:'#d4863f',錫錠:'#cfd6da',鐵錠:'#9aa3ab',銅鎬:'#c47a3c',古樹種子:'#8fb257',樹精核心:'#9dffb0',堅硬樹皮:'#6b4e34',古老樹枝:'#8a6a44',自然精華:'#7fd98a',樹精法杖:'#7fd98a',樹精裝備:'#5a6e3a',魔力水晶:'#9b7bff',發光蘑菇:'#6fe0ff',
  皮帽:'#8a5b3a',皮褲:'#7a4f30',青銅錠:'#c08a3e',青銅盔:'#b07a36',青銅甲:'#b07a36',青銅護腿:'#9c6a2e',鐵盔:'#8a939b',鐵甲:'#8a939b',鐵護腿:'#757e86',
  木盾:'#8f6a3e',青銅盾:'#b07a36',鐵盾:'#8a939b',
  胡蘿蔔:'#e07a2a',胡蘿蔔種子:'#b59a5a',蘑菇湯:'#c98a4a',胡蘿蔔湯:'#e09a3a',燉肉:'#8a4a2b',
  狼王的心臟:'#d0485a',長老年輪:'#c9a26a'};
// 背包與箱子都算格子：材料一格疊 50、食物 20，武器、工具、護甲一格一個
let BAG_SLOTS=32;const CHEST_SLOTS=24; // BAG_SLOTS: CFG.bagSlots
/* ---------- world settings (admin page, phase 3) ---------- */
// every world has its own, saved in world.json (cfg). The server-run world owns them and sends them to everyone (world message, evt cfg);
// solo always uses the defaults. Numbers: [default, min, max]
const CFG_DEF={mobHp:[1,.5,3],mobDmg:[1,.25,3],mobCount:[1,.25,3],nightMobs:[1,0,3],bossHp:[1,.5,5],drops:[1,.5,5],cropSpeed:[1,.5,10],smeltSpeed:[1,.5,10],
  dayMin:[6,2,30],bagSlots:[32,16,64],wear:[1,0,3],skillRate:[1,.5,5],skillLoss:[5,0,50]};
const CFG_BOOL={passive:false,freeBuild:false},CFG_DEATH=['keep','bag','all'];
let CFG={};
function normCfg(c){c=c&&typeof c==='object'?c:{};const o={};
  for(const k in CFG_DEF){const[d,lo,hi]=CFG_DEF[k],v=Number(c[k]);o[k]=c[k]!==undefined&&c[k]!==null&&c[k]!==''&&isFinite(v)?Math.min(hi,Math.max(lo,v)):d}
  o.bagSlots=Math.round(o.bagSlots);for(const k in CFG_BOOL)o[k]=typeof c[k]==='boolean'?c[k]:CFG_BOOL[k];o.death=CFG_DEATH.includes(c.death)?c.death:'bag';return o}
// live: the settings changed while playing, so redraw what shows them
function applyCfg(c,live){CFG=normCfg(c);BAG_SLOTS=CFG.bagSlots;DAY_LEN=CFG.dayMin*60;if(live&&!HEADLESS){hotSig='';if(!$('panel').hidden)renderPanel()}}
applyCfg();
// loot from the world (chopping, mining, kills, bosses, harvests) is scaled by CFG.drops; refunds and chests are not
const dropN=(a,b)=>Math.max(1,Math.round(ri(a,b)*CFG.drops));
function lootTo(from,k,n,x,y){giveTo(from,k,Math.max(1,Math.round(n*CFG.drops)),x,y)}
function lootAll(k,n,x,y){giveAll(k,Math.max(1,Math.round(n*CFG.drops)),x,y)}
// free build: buildings cost nothing (equipment still does)
const freeB=r=>CFG.freeBuild&&r.build,canPay=r=>freeB(r)||afford(r.cost);
/* ---------- icons ---------- */
// 24×24 SVG icons for items (by name) and buildings (by recipe id); anything without one falls back to a colour swatch
const meat=(c,l)=>`<rect x="4.5" y="13" width="9" height="3" rx="1.5" transform="rotate(-45 9 14.5)" fill="#eee4d0"/><circle cx="4.6" cy="17.6" r="2" fill="#eee4d0"/><circle cx="6.4" cy="19.4" r="2" fill="#eee4d0"/><ellipse cx="15" cy="9" rx="6.5" ry="5" transform="rotate(-45 15 9)" fill="${c}"/><ellipse cx="13.6" cy="7.6" rx="2.2" ry="1.2" transform="rotate(-45 13.6 7.6)" fill="${l}"/>`;
const ore=(b,o)=>`<path d="M3 18l2-7 6-5 7 2 3 10-8 3z" fill="${b}"/><path d="M5 11l6-5 7 2-6 3z" fill="#ffffff22"/><circle cx="9" cy="14" r="2" fill="${o}"/><circle cx="14.5" cy="11" r="1.6" fill="${o}"/><circle cx="15" cy="16.5" r="1.8" fill="${o}"/><circle cx="10.5" cy="9" r="1.1" fill="${o}"/>`;
const ingot=(c,l,d)=>`<path d="M2.5 18l3.5-8h12l3.5 8z" fill="${c}"/><path d="M6 10h12l-1.4 3H7.4z" fill="${l}"/><path d="M2.5 18h19v2h-19z" fill="${d}"/>`;
const handle=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#7b5634" stroke-width="2.6" stroke-linecap="round"/>`;
const pick=c=>handle(6,21,15,7)+`<path d="M3.5 9.5Q12 1 21 8Q12 5 3.5 9.5z" fill="${c}"/>`;
// armour pieces: helmet, body, legs, in a base colour c and a light trim l
const helm=(c,l)=>`<path d="M4 15a8 8 0 0 1 16 0v3H4z" fill="${c}"/><path d="M4 15h16v3H4z" fill="${l}"/><path d="M12 7v8" stroke="${l}" stroke-width="1.6"/><rect x="10.5" y="15" width="3" height="5" fill="${c}"/>`;
const bodyA=(c,l)=>`<path d="M8 3l4 3 4-3 4.5 3.5-2.5 5V21H6V11.5L3.5 6.5z" fill="${c}"/><path d="M12 6v15M7 12h10" stroke="${l}" stroke-width="1"/><circle cx="12" cy="9" r=".9" fill="${l}"/>`;
const shieldI=(c,l)=>`<path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10.5-4.5-2-8-5.5-8-10.5v-6z" fill="${c}"/><path d="M12 3v18M5 9h14" stroke="${l}" stroke-width="1.2"/><circle cx="12" cy="9" r="2.2" fill="${l}"/>`;
const bowl=(c,l)=>`<path d="M3 11h18a9 7 0 0 1-18 0z" fill="#8a6236"/><path d="M3 11h18" stroke="#5a3d22" stroke-width="1.4"/><ellipse cx="12" cy="11" rx="8" ry="2" fill="${c}"/><circle cx="9" cy="10.6" r="1.2" fill="${l}"/><circle cx="14" cy="11.2" r="1" fill="${l}"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4" stroke="#ffffff66" stroke-width="1" fill="none"/>`;
const legsA=(c,l)=>`<path d="M5 3h14v5l-1.5 13h-4L12 10l-1.5 11h-4L5 8z" fill="${c}"/><path d="M5 6h14" stroke="${l}" stroke-width="1.6"/><path d="M7 15h3M14 15h3" stroke="${l}" stroke-width="1"/>`;
const ICON={
  木頭:'<rect x="2" y="12" width="17" height="7" rx="3.5" fill="#7a4f2a"/><ellipse cx="19" cy="15.5" rx="2.6" ry="3.5" fill="#d9b07a"/><circle cx="19" cy="15.5" r="1.1" fill="#a0703f"/><rect x="4" y="5" width="16" height="7" rx="3.5" fill="#8f6236"/><ellipse cx="20" cy="8.5" rx="2.6" ry="3.5" fill="#e3bf8a"/><circle cx="20" cy="8.5" r="1.1" fill="#a0703f"/>',
  石頭:'<path d="M3 18l2-8 6-5 7 3 3 10-8 3z" fill="#8d918c"/><path d="M5 10l6-5 7 3-6 3z" fill="#b4b8b1"/>',

    m.atkT-=dt;if(m.atkT<=0&&d<340){const opts=['dash'];if(d<170)opts.push('claw');if(d<ROAR_R+20)opts.push('roar');
      const o=opts.length>1?opts.filter(k=>k!==m.lastAtk):opts,k=o[Math.floor(Math.random()*o.length)];m.lastAtk=k;m.face=a;
      if(k==='claw'){m.state='cwind';m.t=.5}else if(k==='roar'){m.state='rwind';m.t=ROAR_WIND}else{m.state='wind';m.t=.7}}}
  else if(m.state==='rwind'){m.t-=dt;if(m.t<=0){bossRoar(m,T);m.state='rrec';m.t=.45}}
  else if(m.state==='rrec'){m.t-=dt;if(m.t<=0){m.state='chase';m.atkT=rnd(1.4,2.4)}}
  else if(m.state==='cwind'){m.t-=dt;m.face=a;if(m.t<=0){m.state='claw';m.cn=0;m.cph='lunge';m.t=CLAW_LUNGE}}
  else if(m.state==='claw'){m.t-=dt;
    if(m.cph==='lunge'){move(m,Math.cos(m.face)*CLAW_SPD*dt,Math.sin(m.face)*CLAW_SPD*dt);
      if(m.t<=0){clawSwipe(m,T);m.cn++;if(m.cn>=3){m.state='chase';m.atkT=rnd(1.4,2.4)}else{m.cph='pause';m.t=CLAW_PAUSE}}}
    else{const df=Math.atan2(Math.sin(a-m.face),Math.cos(a-m.face));m.face+=Math.max(-4*dt,Math.min(4*dt,df)); // turns toward you, but not instantly
      if(m.t<=0){m.cph='lunge';m.t=CLAW_LUNGE}}}
  else if(m.state==='wind'){m.t-=dt;m.face=a;if(m.t<=0){m.state='dash';m.t=.42;m.hitDash=false}}
  else if(m.state==='dash'){m.t-=dt;move(m,Math.cos(m.face)*500*dt,Math.sin(m.face)*500*dt);if(!m.hitDash&&d<m.r+T.r+6){hurt(T,18,m);m.hitDash=true}
    if(m.t<=0){m.state='chase';m.atkT=rnd(1.4,2.4)}}
}

// Treant: slow; every skill stops it and shows a tell first
const TR_SLAM_R=146,TR_SLAM_ARC=.95,TR_SLAM_DMG=20,ROOT_R=57,ROOT_T=1.6,ROOT_DMG=6,ROOT_MARK=.8,SEED_N=5,SEED_SPD=250,SEED_DMG=7,SEED_LIFE=2.2,TR_CAST_R=560;
// Treant Elder: calls saplings, casts black fog (shrinks the view of whoever stands in it), grows a ring of choppable trees around you
const LEAF_COL=['#7fd98a','#b6ff9a','#4f9a3a'],FOG_CR=150,FOG_LIFE=7,BLIND_R=105,ETREE_LIFE=30,EAT_T=15,EAT_WAIT=4,EAT_HEAL=.1,RECALL_SPD=170,TR_SAY={call:'孩子們，來！',fog:'黑霧…',grow:'森林啊，困住他們'};
// a ring of trees around T with one gap; only on open land, never on anyone
function growWall(T){const i0=Math.floor(T.x/CELL),j0=Math.floor(T.y/CELL),gap=Math.random()*6.28;
  for(let j=j0-4;j<=j0+4;j++)for(let i=i0-4;i<=i0+4;i++){if(i<0||j<0||i>=COLS||j>=ROWS)continue;const x=(i+.5)*CELL,y=(j+.5)*CELL,r=Math.hypot(x-T.x,y-T.y),c=j*COLS+i;
    if(r<92||r>132||angDiff(Math.atan2(y-T.y,x-T.x),gap)<.55||!biome[c]||biome[c]===B_LAVA||resGrid[c]||structGrid[c]||c===altar.cell||TG.some(q=>Math.hypot(q.x-x,q.y-y)<q.r+22))continue;
    evt({t:'ra',k:'etree',x:Math.round(x+rnd(-4,4)),y:Math.round(y+rnd(-4,4)),c});etrees.push({c,at:time+ETREE_LIFE})}}
// phase 2: saplings still alive EAT_T after a call are called back and eaten, each one heals EAT_HEAL of max hp
function eatSprout(m,s){const i=mobs.indexOf(s);if(i<0)return;mobs.splice(i,1);const h=Math.round(m.max*EAT_HEAL);m.hp=Math.min(m.max,m.hp+h);
  evt({t:'mk',id:s.id,x:s.x,y:s.y});evt({t:'et',x:Math.round(m.x),y:Math.round(m.y),h})}
function rootPlayer(dur){if(P.roll>0||P.inv>0||P.dead)return;P.rooted=dur;toast('被根鬚纏住了！')}
// the treant is the forest walking: trees, rocks and walls don't stop it (at its size it could never fit between them); only water does
function moveTreant(m,dx,dy){if(biomeAt(m.x,m.y)===B_SWAMP){dx*=SWAMP_K;dy*=SWAMP_K}if(!isWater(m.x+dx,m.y))m.x+=dx;if(!isWater(m.x,m.y+dy))m.y+=dy}
function treantList(T){return T&&!TG.includes(T)?[...TG,T]:TG}
function updateTreant(m,dt,d,a,T){
  if(!m.p2&&m.hp<m.max*.5){m.p2=true;evt({t:'bn',h:'樹精長老發怒了',s:'小樹精、黑霧和樹牆會來得更頻繁・小樹精 15 秒內沒清光，會被長老吃掉回血'})}
  m.callT=(m.callT??6)-dt;m.fogT=(m.fogT??9)-dt;m.growT=(m.growT??12)-dt;
  if(m.eatT!=null){m.eatT-=dt;if(m.eatT<=0&&m.state==='chase'){m.eatT=null;const sp=mobs.filter(o=>o.k==='sprout');
    if(sp.length){for(const o of sp)o.state='recall';m.state='eat';m.t=EAT_WAIT;evt({t:'tc',x:Math.round(m.x),y:Math.round(m.y),s:'回來吧，孩子們…'})}}}
  if(Math.hypot(m.x-altar.x,m.y-altar.y)>1100||d>1000){m.state='chase';m.face=Math.atan2(altar.y-m.y,altar.x-m.x);moveTreant(m,Math.cos(m.face)*m.spd*dt,Math.sin(m.face)*m.spd*dt);m.hp=Math.min(m.max,m.hp+30*dt);return}
  m.healT=(m.healT??12)-dt;
  if(m.state==='chase'){m.face=a;if(d>m.r+T.r)moveTreant(m,Math.cos(a)*m.spd*dt,Math.sin(a)*m.spd*dt);
    if(d<m.r+T.r+8&&m.acd<=0){hurt(T,12,m);m.acd=1.6}
    m.atkT-=dt;
    if(m.healT<=0&&m.hp<m.max*.85){m.state='heal';m.t=2.4;m.healT=14;evt({t:'tf',x:Math.round(m.x),y:Math.round(m.y)})}
    else if(m.atkT<=0){const opts=[];if(d<TR_SLAM_R+T.r)opts.push('slam');if(d<TR_CAST_R){opts.push('root','seed');if(m.callT<=0&&!mobs.some(o=>o.k==='sprout'))opts.push('call');if(m.fogT<=0)opts.push('fog');if(m.growT<=0)opts.push('grow')}
      if(opts.length){const o=opts.length>1?opts.filter(k=>k!==m.lastAtk):opts,k=o[Math.floor(Math.random()*o.length)];m.lastAtk=k;m.face=a;
        if(k==='slam'){m.state='swind';m.t=.85}else if(k==='root'){m.state='rootc';m.t=.55}
        else if(TR_SAY[k]){m.state=k+'c';m.t=k==='grow'?.9:.8;evt({t:'tc',x:Math.round(m.x),y:Math.round(m.y),s:TR_SAY[k]})}else{m.state='seedc';m.t=.7}}}}
  else if(m.state==='swind'){m.t-=dt;if(m.t<=0){for(const q of treantList(T))if(dist(m,q)<TR_SLAM_R+q.r&&angDiff(Math.atan2(q.y-m.y,q.x-m.x),m.face)<TR_SLAM_ARC)hurt(q,TR_SLAM_DMG,m);
      evt({t:'ts',x:Math.round(m.x),y:Math.round(m.y),a:Math.round(m.face*100)/100});m.state='trec';m.t=.65}}
  else if(m.state==='rootc'){m.t-=dt;m.face=a;if(m.t<=0){m.rootAt={x:T.x,y:T.y,T};evt({t:'rm',x:Math.round(T.x),y:Math.round(T.y)});m.state='rootw';m.t=ROOT_MARK}}
  else if(m.state==='rootw'){m.t-=dt;if(m.t<=0){const r=m.rootAt,q=r.T;evt({t:'ru',x:Math.round(r.x),y:Math.round(r.y)});
      if(Math.hypot(q.x-r.x,q.y-r.y)<ROOT_R+q.r){if(q===P)rootPlayer(ROOT_T);else if(!q.isPet)sendTo(q.id,{t:'root',d:ROOT_T});hurt(q,ROOT_DMG,r)}
      m.state='trec';m.t=.5}}
  else if(m.state==='seedc'){m.t-=dt;m.face=a;if(m.t<=0){for(let i=0;i<SEED_N;i++)evt({t:'sd',id:++seedSeq,x:Math.round(m.x),y:Math.round(m.y-6),a:Math.round((a+(i-(SEED_N-1)/2)*.2)*100)/100});m.state='trec';m.t=.6}}
  else if(m.state==='callc'){m.t-=dt;if(m.t<=0){for(let i=0,n=(m.p2?4:2)*Math.max(1,TG.length);i<n;i++){const s=findSpot(m.x,m.y,50,170);if(s){spawnMob('sprout',s.x,s.y).aggro=60;evt({t:'sp',x:Math.round(s.x),y:Math.round(s.y)})}}m.callT=m.p2?9:14;if(m.p2)m.eatT=EAT_T;m.state='trec';m.t=.5}}
  else if(m.state==='fogc'){m.t-=dt;m.face=a;if(m.t<=0){evt({t:'fg',x:Math.round(T.x),y:Math.round(T.y)});m.fogT=m.p2?8:12;m.state='trec';m.t=.5}}
  else if(m.state==='growc'){m.t-=dt;m.face=a;if(m.t<=0){growWall(T);m.growT=m.p2?10:15;m.state='trec';m.t=.6}}
  else if(m.state==='eat'){m.t-=dt;for(const o of mobs.filter(o=>o.k==='sprout'&&o.state==='recall'))if(m.t<=0||dist(o,m)<m.r+o.r+6)eatSprout(m,o);if(m.t<=0){m.state='trec';m.t=.4}}
  else if(m.state==='heal'){m.t-=dt;m.hp=Math.min(m.max,m.hp+14*dt);if(m.t<=0){m.state='chase';m.atkT=rnd(1,2)}}
  else if(m.state==='trec'){m.t-=dt;if(m.t<=0){m.state='chase';m.atkT=rnd(1.6,2.6)}}
}

/* ---------- pets ---------- */
// each player simulates their own summoned pet locally (like the player); its hits/pickups go through act()
const curPet=()=>pets.find(p=>p.id===petOut&&p.down<=0)||null;
function petOf(owner){if(owner===ME){const p=curPet();return p&&!P.dead?p:null}const o=others.get(owner);return o&&!o.dead&&o.pet||null}
function addPet(k){const n=pets.filter(p=>p.k===k).length+1;const p={id:Date.now()+Math.floor(Math.random()*1000),k,name:`${PETS[k].name} ${n}`,hp:PETS[k].hp,bag:{},down:0};
  pets.push(p);if(!curPet())summonPet(p.id);writeSave();if(!$('panel').hidden)renderPanel()}
function placePet(p,glow){Object.assign(p,{isPet:true,owner:ME,r:PETS[p.k].r,face:P.face,anim:Math.random()*9,cd:0,gcd:0,flash:0,glow:0,moving:false});
  let x=P.x-Math.cos(P.face)*28,y=P.y-Math.sin(P.face)*28;for(let k=0;k<20&&blocked(x,y,p.r);k++){x=P.x+rnd(-40,40);y=P.y+rnd(-40,40)}
  if(blocked(x,y,p.r)){x=P.x;y=P.y}p.x=x;p.y=y;
  if(glow){p.glow=1.4;burst(x,y-8,'#ffe08a',26);burst(x,y-8,'#fff6d0',12)}}
function summonPet(id){petOut=id;const p=curPet();if(p)placePet(p,true)}
function hurtPet(dmg,src){const p=curPet();if(!p)return;p.hp-=dmg;p.flash=.15;
  const a=Math.atan2(p.y-src.y,p.x-src.x);move(p,Math.cos(a)*12,Math.sin(a)*12);floats.push({x:p.x,y:p.y-22,txt:'-'+Math.round(dmg),t:.8,col:'#ffb0a0'});
  if(p.hp<=0)petDown(p)}
function petDown(p){p.hp=0;p.down=PET_DOWN;burst(p.x,p.y-6,'#6a4a3a',16);
  if(Object.keys(p.bag).length){act({t:'drop',x:p.x,y:p.y,bag:p.bag});p.bag={}}
  toast(`${p.name}倒下了，${PET_DOWN} 秒後回來`);writeSave()}
function petStep(p,tx,ty,spd,dt){const a=Math.atan2(ty-p.y,tx-p.x);p.face=a;p.moving=true;move(p,Math.cos(a)*spd*dt,Math.sin(a)*spd*dt)}
function updatePet(dt){
  for(const p of pets)if(p.down>0){p.down-=dt;if(p.down<=0){p.down=0;p.hp=PETS[p.k].hp;if(p.id===petOut){placePet(p,true);toast(`${p.name}回來了`)}}}
  const p=curPet();if(!p)return;const D=PETS[p.k];
  p.anim+=dt;p.cd-=dt;p.gcd-=dt;p.flash-=dt;p.glow-=dt;p.moving=false;
  if(P.dead)return;
  if(burnTick(p,dt)){p.hp-=BURN_DPS*dt;if(p.hp<=0){petDown(p);return}}
  if(P.boat)return; // waits on the shore while the owner is at sea
  const od=dist(p,P);if(od>500){placePet(p,false);return}
  // fight: hostile mobs near the owner (wild boars only once they're angry, so taming isn't interrupted)
  let tgt=null,bd=1e9;for(const m of mobs){if((m.k==='boar'||m.k==='frog')&&m.aggro<=0)continue;const dm=dist(m,P);if(dm<220){const d=dist(m,p);if(d<bd){bd=d;tgt=m}}}
  if(tgt){const reach=p.r+tgt.r+4;if(bd>reach)petStep(p,tgt.x,tgt.y,D.spd*1.1,dt);else p.face=Math.atan2(tgt.y-p.y,tgt.x-p.x);
    if(bd<=reach+4&&p.cd<=0){p.cd=D.cd;floats.push({x:tgt.x,y:tgt.y-tgt.r-8,txt:shielded(tgt)?'無敵':String(D.dmg),t:.7,col:shielded(tgt)?'#9dffb0':'#d8f0b0'});burst(tgt.x,tgt.y,tgt.k==='moss'?'#9fc069':'#b84a3a',4);
      act({t:'hit',id:tgt.id,dmg:D.dmg,x:p.x,y:p.y,pet:1})}
    return}
  // gather: loose pickables near the owner
  if(D.gather&&p.gcd<=0){let g=null,gd=1e9;forCells(P.x,P.y,4,o=>{const R=RES[o.k];if(!R.pick||o.k==='bush'&&o.dep>0)return;if(dist(o,P)>160)return;const d=dist(o,p);if(d<gd){gd=d;g=o}});
    if(g){if(gd>16)petStep(p,g.x,g.y,D.spd,dt);else{p.gcd=1.2;act({t:'res',c:g.cell,dmg:0,pet:1})}return}}
  // follow
  if(od>56)petStep(p,P.x,P.y,od>200?D.spd*1.4:D.spd,dt)}

/* ---------- network ---------- */
function net(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function sendTo(id,o){o.to=id;net(o)}
function evt(o){applyEvt(o);if(MODE==='host')net(o)}          // world change: apply here, mirror to clients
function act(o){if(MODE==='client')net(o);else handleAct(o,ME)} // player intent: host/solo decide
function giveTo(from,k,n,x,y,toPet){if(n<=0)return;if(from===ME)give(k,n,x,y,toPet);else sendTo(from,{t:'give',k,n,x,y,p:toPet?1:0})}
function toPlayer(from,o){if(from===ME)onPrivate(o);else sendTo(from,o)}
function toAll(o){onPrivate(o);for(const id of others.keys())sendTo(id,Object.assign({},o))}
// messages meant for one player only (taming progress, new pets)
function onPrivate(m){switch(m.t){
  case'love':floats.push({x:m.x,y:m.y-24,txt:`♥ ${m.n}/${TAME_N}`,t:1.2,col:'#ff9fb8'});break;
  case'tame':{const k=m.k||'boar';addPet(k);banner('馴服了'+PETS[k].name,'打開背包的「寵物」分頁可以召喚或收回');break}
  case'tdown':{const first=!treantDown;treantDown=true;if(!has('長老年輪'))give('長老年輪',1,m.x,m.y-56);if(first||Math.random()<.3)give('樹精核心',1,m.x,m.y-42);if(first)toast('解鎖配方：樹精法杖、樹精裝備');writeSave();if(!$('panel').hidden)renderPanel();break} // the rare core is rolled per player; a first kill always gets one
  case'pup':if(!pets.some(p=>p.k==='wolf'))addPet('wolf');if(!has('狼王的心臟')){give('狼王的心臟',1,P.x,P.y-20);toast('得到狼王的心臟・拿在手上、帶著古樹種子到石祭壇可以喚醒樹精長老，心臟不會用掉');writeSave()}break;
  case'board':P.boat=true;P.x=m.x;P.y=m.y;P.roll=0;toast('上船了・靠岸按 E 下船');break; // each player's first Wolf King only; pets can't be released, so owning a pup means this one's used
}}
function giveAll(k,n,x,y){giveTo(ME,k,n,x,y);for(const id of others.keys())giveTo(id,k,n,x,y)}
const nameOf=id=>id===ME?myName:(others.get(id)||{}).n;
// a grave is yours if your name is on it; solo has one player (whose name is not kept between visits), so every grave is yours
const myGrave=l=>!!l.g&&(MODE==='solo'||l.g===myName);
function refund(from,cost,msg){if(from===ME){for(const k in cost)inv[k]=(inv[k]||0)+cost[k];toast(msg)}else sendTo(from,{t:'refund',cost,msg})}
function handleAct(m,from){switch(m.t){
  case'hit':{const mob=mobs.find(o=>o.id===m.id);if(mob)hitMob(mob,m.dmg,from,m.x,m.y,m.pet);break}
  case'res':worldRes(m.c,m.dmg,from,m.pet);break;
  case'feed':{const b=mobs.find(o=>o.id===m.id);if(!b||!TAME_FOOD[b.k]||b.aggro>0){refund(from,{[m.f||'莓果']:1},'牠現在不肯吃');break}
    b.love=(b.love||0)+1;b.wt=2;b.wx=b.wy=0;if(b.k==='frog'){b.state='idle';b.t=2}
    if(b.love>=TAME_N){mobs.splice(mobs.indexOf(b),1);evt({t:'tm',id:b.id,x:b.x,y:b.y});toPlayer(from,{t:'tame',k:b.k})}
    else toPlayer(from,{t:'love',n:b.love,x:b.x,y:b.y});break}
  case'drop':{const bag=normBox(m.bag);if(Object.keys(bag).length)evt({t:'ld',id:++lootSeq,x:m.x,y:m.y,bag,g:m.g?String(m.g).slice(0,10):undefined});break}
  case'fput':{const s=structGrid[m.c],n=Math.floor(m.n);if(!s||s.k!=='furnace'||!(n>0)||m.k!=='煤炭'&&!SMELT[m.k]){if(n>0)refund(from,{[m.k]:n},'熔爐不見了，材料退回');break}
    const f=s.fz;if(m.k==='煤炭')f.fuel+=n;else f.q[m.k]=(f.q[m.k]||0)+n;evt({t:'fz',c:m.c,f});break}
  case'fout':{const s=structGrid[m.c];if(!s||s.k!=='furnace')break;const f=s.fz;for(const k in f.out)giveTo(from,k,f.out[k],s.x,s.y-20);f.out={};evt({t:'fz',c:m.c,f});break}
  // chests: cput = a player puts items in (already taken from their bag), cget = takes them out. What doesn't fit goes back
  case'cput':{const s=structGrid[m.c],bag=normBox(m.bag);if(!s||s.k!=='chest'){if(Object.keys(bag).length)refund(from,bag,'箱子不見了，東西退回');break}
    const back={};for(const k in bag){const n=Math.min(bag[k],roomFor(s.box,k,CHEST_SLOTS));if(n>0)s.box[k]=(s.box[k]||0)+n;if(bag[k]>n)back[k]=bag[k]-n}
    evt({t:'cb',c:m.c,b:s.box});if(Object.keys(back).length)refund(from,back,'箱子滿了，放不下的退回');break}
  case'cget':{const s=structGrid[m.c],bag=normBox(m.bag);if(!s||s.k!=='chest')break;let dy=0;
    for(const k in bag){const n=Math.min(bag[k],s.box[k]||0);if(!(n>0))continue;if(!(s.box[k]-=n))delete s.box[k];giveTo(from,k,n,s.x,s.y-20-dy);dy+=14}evt({t:'cb',c:m.c,b:s.box});break}
  case'pick':{const l=loots.find(o=>o.id===m.id);if(!l)break;if(l.g&&MODE!=='solo'&&l.g!==nameOf(from)){refund(from,{},`這是${l.g}的墓碑`);break}evt({t:'lr',id:l.id});for(const k in l.bag)giveTo(from,k,l.bag[k],l.x,l.y);break}
  case'build':{if(isWallK(m.k)){const g=snapWall(m.o==='v'?'v':'h',m.x,m.y);if(g.c<0||biome[g.c]===0||(g.o==='v'?wallV:wallH)[g.c])refund(from,m.cost,'那個位置被別人佔走了，材料退回');else evt({t:'sa',k:m.k,x:g.x,y:g.y,o:g.o});break}
    const c=ci(m.x,m.y);if(m.k==='boat'?!boatSpotOk(c):c<0||biome[c]===0||biome[c]===B_LAVA||structGrid[c]||c===altar.cell||!(m.k in SOLID_S))refund(from,m.cost,'那個位置被別人佔走了，材料退回');else evt({t:'sa',k:m.k,x:m.x,y:m.y});break}

      // 先從脊椎算出每一列可能碰到鯊魚的欄位範圍，範圍外的格子完全不用取樣
      spanMin.fill(1e9,0,rows);spanMax.fill(-1e9,0,rows);
      for(let k=0;k<NODES;k++){const e=reachAt(k/(NODES-1),L,tip)+margin,nx=spine[k*2],ny=spine[k*2+1],a=Math.floor((nx-e-ox)/CW),b=Math.floor((nx+e-ox)/CW);
        for(let r=Math.max(r0,Math.floor((ny-e-oy)/CH));r<=Math.min(r0+rows-1,Math.floor((ny+e-oy)/CH));r++){const q=r-r0;if(a<spanMin[q])spanMin[q]=a;if(b>spanMax[q])spanMax[q]=b}}
      for(let r=r0;r<r0+rows;r++){const q=r-r0;segHint=-1;for(let c=Math.max(c0,spanMin[q]);c<=Math.min(c1,spanMax[q]);c++){const x=ox+c*CW,y=oy+r*CH;if(!isSeaAt(x+CW/2,y+CH/2))continue;
        const center=sampleShark(x+CW/2,y+CH/2,L);
        // 省運算：離身體和鰭夠遠就跳過；身體深處一定整格都在裡面，不用再多點取樣
        if(!center&&hitDist>reachAt(hitS,L,tip)+diag)continue;
        const flag=hitFlag,shade=hitShade,s=hitS,v=hitV;let hits=center?1:0;
        if(center&&hitDist<halfWidth(s)*L-diag)hits=5;else for(let k=0;k<SUB.length;k+=2)if(sampleShark(x+SUB[k]*CW,y+SUB[k+1]*CH,L))hits++;
        if(!hits)continue;const cov=hits/5,key=(hash(Math.round(s*52),Math.round(v/(CW*.9)),sh.id)*4294967295)>>>0;
        if(center&&cov>=.6)drawSharkCell(x,y,key,clamp(shade+(hash(c-hc,r-hr,Math.floor(T*6))-.5)*.06,0,1),flag,dim);else drawSharkCell(x,y,key,cov,F_EDGE,dim)}}}}
  function drawSharkCell(x,y,key,shade,flag,dim){const roll=hash(key,Math.floor(T*2.4+(key%997)/97),7),tx=x+CW/2,ty=y+CH/2+.5;
    if(flag===F_EDGE){const set=shade>=.5?EDGE_HEAVY:EDGE_LIGHT,g=(70+shade*80)*dim;
      ctx.fillStyle=roll<.07?ACCENTS[key%ACCENTS.length]:SKIN_STYLES[Math.round(g)];
      ctx.fillText(set[(key>>>8)%set.length],tx,ty);return}
    let level,glyph;
    if(flag===F_RIDGE){level=226;glyph=RIDGE_G[(key>>>8)%RIDGE_G.length]}
    else if(flag===F_EYE){level=12;glyph='o'}
    else if(flag===F_FIN){level=40+shade*120;glyph=FIN_G[(key>>>8)%FIN_G.length]}
    else{level=46+shade*160;glyph=SKIN[clamp(Math.floor((1-shade)*8.99)+((key>>>4)%3)-1,0,SKIN.length-1)]}
    level*=dim;
    ctx.fillStyle=SKIN_STYLES[Math.round(level)];ctx.fillRect(x+.5,y+.5,CW-.6,CH-.6);
    ctx.fillStyle=flag===F_EYE?'#9aa0ad':roll<.09?ACCENTS[key%ACCENTS.length]:roll<.13?'#ffffff':shade>.55?'#0e0f13':'#1b1d24';
    ctx.fillText(glyph,tx,ty)}
  // 畫在地面之後、其他物件與夜晚遮罩之前，所以天黑時會一起變暗；只畫在海上的字元格
  function draw(cx,cy,hw,hh){if(!D)return;
    const c0=Math.max(0,Math.floor((cx-hw)/CW)-1),c1=Math.min(GC-1,Math.floor((cx+hw)/CW)+1),r0=Math.max(0,Math.floor((cy-hh)/CH)-1),r1=Math.min(GR-1,Math.floor((cy+hh)/CH)+1);
    if(c0>c1||r0>r1)return;
    // 魚畫在實際位置，不吸附格線；轉向或受驚時比較亮
    for(const b of fishBuckets)b.length=0;
    for(const f of fish){if(!f.alive||Math.abs(f.x-cx)>hw+10||Math.abs(f.y-cy)>hh+10)continue;
      const v=.3+(.4*(f.depth-.55))/.45+.3*Math.max(clamp(Math.abs(f.turn)/3.5,0,1),f.alarm);fishBuckets[clamp(Math.floor(v*5),0,4)].push(f)}
    for(const b of wakeBuckets)b.length=0;
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const i=r*GC+c,e=energy[i];if(e>.45&&isSeaAt(c*CW,r*CH))wakeBuckets[clamp(Math.floor((e-.45)*5),0,WAKE_LEVELS-1)].push(i)}
    for(let l=0;l<WAKE_LEVELS;l++){if(!wakeBuckets[l].length)continue;ctx.fillStyle=wakeStyles[l];for(const i of wakeBuckets[l])ctx.fillRect((i%GC)*CW+CW*.66-1,Math.floor(i/GC)*CH+CH*.64-1,2,2)}
    ctx.save();ctx.font=`600 ${Math.round(CH*.74)}px ui-monospace,Menlo,Consolas,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const i=r*GC+c,h=heat[i];if(h<.08||!isSeaAt(c*CW,r*CH))continue;
      ctx.fillStyle=h>.5?`rgba(255,120,60,${h.toFixed(2)})`:`rgba(220,40,40,${(h*1.6).toFixed(2)})`;ctx.fillText(h>.6?'*':'·',c*CW+CW/2,r*CH+CH/2+.5)}
    const glyphFont=ctx.font;ctx.font='600 10px ui-monospace,Menlo,Consolas,monospace';
    for(let b=0;b<fishBuckets.length;b++){if(!fishBuckets[b].length)continue;ctx.fillStyle=fishStyles[b];for(const f of fishBuckets[b])ctx.fillText('-',f.x,f.y)}
    ctx.font=glyphFont;
    drawSharks(cx-hw-CW,cx+hw+CW,cy-hh-CH,cy+hh+CH);
    ctx.restore()}
  return{update,draw}})();

/* ---------- loop ---------- */
let last=performance.now();
// solo pauses everything; in multiplayer the world keeps going while your panel is open or you're down
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(ready){if(!paused)updateLocal(dt);
    if(MODE==='solo'){if(!paused){updateWorld(dt);updatePet(dt);updateFx(dt)}else if(panelTab==='furnace'&&!$('panel').hidden)tickFurnaces(dt)}
    else{if(!worldPaused){if(MODE==='host')updateWorld(dt);else tickClient(dt);if(started)updatePet(dt)}tickOthers(dt);updateFx(dt);netTick(dt)}
    if(!HEADLESS){render();hudT-=dt;if(hudT<=0){hudT=.1;hud();refreshFurnacePanel()}}}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- intro ---------- */
function setupIntro(){
  cam.x=P.x;cam.y=P.y;
  $('introCtl').innerHTML=TOUCH?'左半邊拖曳移動（推到底衝刺）・右下按鈕攻擊、翻滾、互動・右上開背包製作':'WASD 移動・Shift 衝刺・左鍵攻擊・右鍵格擋・空白翻滾・E 互動・1～8／滾輪／Q 快捷欄・Tab 背包・M 地圖・Z 表情・Esc 設定';
  if(MODE==='solo')$('introBtns').innerHTML=save?`<button class="act go" id="go" type="button">繼續（第 ${day} 天）</button><button class="act" id="fresh" type="button">新世界</button>`:`<button class="act go" id="go" type="button">開始</button>`;
  else{const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    $('introBtns').innerHTML=`<input class="namein" id="nameIn" maxlength="10" placeholder="你的名字" aria-label="你的名字" value="${esc(myName)}">`+
      `<input class="namein pinin" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN" aria-label="PIN">`+
      `<button class="act go" id="go" type="button">加入（第 ${day} 天）</button>`+(netInfo.local?`<button class="act" id="fresh" type="button">新世界</button>`:'')+
      `<p class="sub" id="loginMsg" style="flex-basis:100%"></p>`;
    const n=$('introNet');n.hidden=false;
    n.innerHTML=netInfo.local?`這台電腦是主機。同事在瀏覽器網址列輸入：<br>${netInfo.ips.length?netInfo.ips.map(ip=>`<b>http://${ip}:${netInfo.port}</b>`).join('<br>'):'（找不到區網 IP，請確認這台電腦有接上公司網路）'}<br><small style="color:var(--mute)">世界由黑色的伺服器視窗在跑，這個分頁可以隨時關掉；關掉黑色視窗世界才會停。</small>`:'已連上主機，你會跟大家在同一個世界。';
    for(const id of['nameIn','pinIn'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
    $('nameIn').addEventListener('input',pinHint);pinHint()}
  $('go').addEventListener('click',()=>{
    if(MODE==='solo'){begin(!save);return}
    if(loggingIn)return;
    myName=($('nameIn').value.trim()||myName).slice(0,10);try{localStorage.setItem('northland-name',myName)}catch(e){}
    loggingIn=true;$('go').disabled=true;loginMsg('登入中…');
    net({t:'login',n:myName,pin:$('pinIn').value.trim(),tok:loadTok()[myName]||'',seed})});
  if($('fresh'))$('fresh').addEventListener('click',e=>{const b=e.currentTarget;if(b.dataset.c)resetSave();else{b.dataset.c='1';b.textContent='確認刪除存檔？'}});
}
function begin(fresh){started=true;$('intro').hidden=true;syncPaused();if(fresh)banner(`第 ${day} 天`,'先砍幾棵樹吧')}
// 登入：名字 + PIN。server 驗證後回傳記號（這台電腦記住，下次免輸入 PIN）和這個人在這個世界的存檔
function loadTok(){try{return JSON.parse(localStorage.getItem('northland-tok'))||{}}catch(e){return{}}}
function loginMsg(t,err){const e=$('loginMsg');if(!e)return;e.textContent=t;e.classList.toggle('err',!!err)}
function pinHint(){const n=$('nameIn').value.trim();
  loginMsg(loadTok()[n]?`這台電腦已記住「${n}」，直接按按鈕就好。`:'第一次用這個名字時，輸入的 PIN（4～8 位數字）就是你之後的密碼。不要用你的真實密碼。')}
function onLogin(m){loggingIn=false;const g=$('go');if(g)g.disabled=false;
  if(!m.ok){loginMsg(m.msg,true);return}
  try{const t=loadTok();t[m.n]=m.tok;localStorage.setItem('northland-tok',JSON.stringify(t))}catch(e){}
  myName=m.n;let ps=m.d;const old=ps?null:loadKey(pkey()); // server 上沒有 → 把這台瀏覽器的舊存檔搬上去
  ps=ps||old;if(ps)applyPersonal(ps);cam.x=P.x;cam.y=P.y;
  begin(!ps);if(old)writeSave('p')}
if(MODE==='solo')bootSolo();else{$('introBtns').innerHTML='<p class="sub">連線中…</p>';connect()}
if(TOUCH)$('touch').hidden=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden)writeSave()});
})();
</script>
